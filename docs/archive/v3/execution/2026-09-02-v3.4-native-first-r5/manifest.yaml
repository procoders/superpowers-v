triage:
  tier: FULL
  pre_eval_id: 2026-09-02T170442Z-v3-4-native-first-replace-the-epic-goal-feature-a-of-hooks-e-5664
  taxonomy_digest: sha256:1f2a12f634422ca72a66cfa195b731a0e19743b5e7fe622fb799821cf5e88e85
  decided_at: '2026-09-02T17:04:42Z'
acceptance_criteria:
- Every tests/*.sh and every script --selftest is green (CI's Python 3.9 floor).
- grep for epic-watch|headless-shim|goal_arm|--goal-status|--arm-goal|autonomy.watch|record-watcher across
  commands skills agents hooks scripts tests .github CONVENTIONS.md returns nothing.
- The UserPromptSubmit hook, driven with synthetic stdin, writes a pre-eval record bound to the stdin
  session and returns the tier in additionalContext; a question writes nothing.
- No prose in commands/skills/agents instructs an agent to append task-outcomes.jsonl or to run compound-v-update-memory.py.
- hooks/hooks.json registers no PostToolUseFailure hook; /v:dashboard has no serve mode.
- Attended DIRECT is documented as an ordinary commit; Phase L is documented as unattended-only and tests/test-triage-landing.sh
  still passes.
test_contract:
  floor_command: bash tests/test-epic-goal-stop.sh
  full_command: bash -c 'for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1;
    }; done; echo all-tests-ok'
  impacted_map:
  - when: hooks/**
    run: bash -c 'bash tests/test-epic-goal-stop.sh && bash tests/test-native-points.sh'
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; /usr/bin/python3 {path} --selftest'
  - when: commands/v-triage.md
    run: bash tests/test-triage-landing.sh
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
jobs:
- id: review-fixes
  title: Close the Review Gate's ISSUES 1–8 from docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review.md
  type: core_slice
  backend: claude
  tier: deep
  effort: high
  isolation: worktree
  run: parallel
  write_allowed:
  - commands/v-status.md
  - scripts/compound-v-preeval.py
  - scripts/compound-v-scorecard.py
  - hooks/triage-prompt-nudge.sh
  - tests/test-native-points.sh
  - scripts/compound-v-emit-workflow.py
  - docs/superpowers/architecture/2026-09-02-viability-audit.md
  - docs/superpowers/architecture/native-mechanisms.md
  - skills/compound-v/phase-preeval.md
  read_allowed:
  - docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review.md
  - docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md
  - hooks/epic-goal-stop.sh
  - commands/v-triage.md
  acceptance:
  - commands/v-status.md mentions no --serve and no dashboard serve subcommand.
  - run_preeval(..., binding=None) exists and is threaded to build_record; no globals()['build_record']
    patch remains; /usr/bin/python3 scripts/compound-v-preeval.py --selftest passes and the triage subcommand's
    JSON still carries session_id/base_commit/declared_paths.
  - scripts/compound-v-scorecard.py --from-runs counts results/attempts/<id>.*.json into rework_rounds,
    with a selftest.
  - hooks/triage-prompt-nudge.sh's header and emitted message no longer claim an uncommitted record is
    invisible to the Stop-time gate; they say the gate reads records off disk and that the commit is for
    durability (--require-triage on another clone, git worktree remove). The once-per-session marker stays,
    with the spec's rationale (amended 2026-09-02). bash tests/test-native-points.sh exits 0.
  - docs/superpowers/architecture/2026-09-02-viability-audit.md §7 row 4 reads done-with-scope-change
    (Phase L kept for unattended landings), not cut; native-mechanisms.md's Stop row no longer mentions
    the goal and the 'why these two' paragraph justifies the one hook event that remains after PostToolUseFailure's
    removal.
  - scripts/compound-v-emit-workflow.py's tests block resolves `scope` against the tier's resolution (full
    | impacted | floor_only as the resolver actually selected), not only against impacted_map presence;
    /usr/bin/python3 scripts/compound-v-emit-workflow.py --selftest passes.
  body: "Read docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review.md — its section \"What to\
    \ fix\nbefore DONE\" lists eight items with file:line evidence. Close every one of them in your worktree,\n\
    then run the commands the acceptance criteria name. You have a developer's shell (tests,\nselftests,\
    \ shellcheck, git rm are admitted); use /usr/bin/python3 for scripts that need PyYAML.\n\nISSUE 1\
    \  commands/v-status.md:109,118 — delete the --serve heading fragment and bullet; point at\n     \
    \    /workflows and /tasks as commands/v-dashboard.md:19 already does.\nISSUE 2  scripts/compound-v-preeval.py\
    \ — give run_preeval a real `binding=None` parameter threaded\n         to its build_record call;\
    \ delete the globals()[\"build_record\"] patch in triage_request;\n         keep byte-identical records\
    \ for every existing caller when binding is absent (the\n         selftest must show it). Keep the\
    \ triage subcommand's JSON shape.\nISSUE 3  scripts/compound-v-scorecard.py:228-230 — rework_rounds\
    \ = number of\n         results/attempts/<id>.*.json files for that job (0 when the directory is absent);\
    \ add a\n         selftest with one job that has two attempt files.\nISSUE 4  RESOLVED BY SPEC AMENDMENT:\
    \ the once-per-session marker STAYS (see the spec WS2, amended\n         2026-09-02: the record answers\
    \ \"already sized\", the marker answers \"already tried\"). Make\n         hooks/triage-prompt-nudge.sh's\
    \ header, skills/compound-v/phase-preeval.md and any test\n         text agree with that rationale;\
    \ do not remove the marker.\nISSUE 5  hooks/triage-prompt-nudge.sh:57-58 and :502 (the emitted message)\
    \ — the Stop-time gate\n         reads pre-eval records OFF DISK (hooks/epic-goal-stop.sh runs jq\
    \ over\n         docs/superpowers/pre-eval/*.json), so an uncommitted record DOES cover its declared\n\
    \         paths. What the commit buys is durability: --require-triage on another clone, and\n    \
    \     survival of `git worktree remove`. Say exactly that, matching phase-preeval.md:14.\nISSUE 6\
    \  docs/superpowers/architecture/2026-09-02-viability-audit.md:116,124 — §7 row 4 is\n         done-with-scope-change\
    \ (attended DIRECT = ordinary commit; Phase L kept for unattended\n         landings), not cut. Fix\
    \ the row and the recommendation line.\nISSUE 7  docs/superpowers/architecture/native-mechanisms.md:176,183-193\
    \ — the `Stop` event row\n         should no longer say `цель` (the goal rule is gone); the paragraph\
    \ \"Почему именно эти две\n         добавлены\" now justifies ONE remaining addition (PreCompact)\
    \ since PostToolUseFailure was\n         removed in 3.4.0 — rewrite it accordingly.\nISSUE 8  scripts/compound-v-emit-workflow.py:~2620\
    \ — `tests.scope` in the recorded block must be\n         the scope the resolver actually selected\
    \ for the tier (full | impacted | floor_only), not\n         \"impacted whenever impacted_map is non-empty\"\
    ; keep the mirror comment about\n         compound-v-fastpath-run.py:default_scope_for in sync, and\
    \ add a selftest for a job whose\n         tier resolved to `full` while the contract has an impacted_map.\n\
    \nReport per issue: file, what changed, the command you ran and its exit code.\n"
- id: spec-review-2
  title: Review Gate — three passes against the spec and the feature-level acceptance criteria
  type: review
  backend: claude
  tier: deep
  effort: high
  isolation: direct
  run: serial
  depends_on:
  - review-fixes
  write_allowed:
  - docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review-2.md
  read_allowed:
  - '**'
  acceptance:
  - The review-2 file exists with SPEC, QUALITY, INTEGRATION and Verdict sections; it states, per ISSUE
    1-8 of the first pass, closed or still open with evidence.
  - The verdict is APPROVED or ISSUES with a numbered list.
  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall).

    Follow it. This is the SECOND pass. Read docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review.md
    (the first pass, ISSUES 1-8) and verify each was closed by run r5''s review-fixes job (ISSUE 4 was
    resolved by a spec amendment: the marker stays). Then review the merged result of runs r2, r4 and
    r5 against

    docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md and the manifest''s

    acceptance_criteria. Run the commands the criteria name (tests, greps, selftests with

    /usr/bin/python3) rather than trusting summaries. Write

    docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review-2.md with sections

    ## Recall, ## SPEC, ## QUALITY, ## INTEGRATION, ## Verdict (APPROVED or ISSUES with a

    numbered list). Report what you found, not what would be reassuring.

    '
