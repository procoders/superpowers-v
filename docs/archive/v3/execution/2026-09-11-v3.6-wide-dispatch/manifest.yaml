  - when: docs/superpowers/architecture/*.md
    run: /usr/bin/python3 -B scripts/compound-v-onboard.py rules-lint --repo .
jobs:
- id: scope-workers-provision
  title: 'Task J-SCOPE — --preexisting honoured in worktree mode; provisioning in the four worker scripts (#19 A/B, gate half)'
  type: implement
  backend: claude
  tier: deep
  effort: high
  isolation: worktree
  run: parallel
  depends_on: []
  test_scope: impacted
  write_allowed:
  - scripts/compound-v-scope-check.py
  - scripts/compound-v-run-codex-worker.sh
  - scripts/compound-v-run-cursor-worker.sh
  - scripts/compound-v-run-antigravity-worker.sh
  - scripts/compound-v-run-opencode-worker.sh
  - tests/test-worker-path-transport.sh
  read_allowed:
  - '**'
  interfaces:
    produces:
    - "every scripts/compound-v-run-*-worker.sh accepts --provision-command <string> (optional) and --provision-timeout-sec <int> (default 600), parsed in the same block as --write-allowed"
    - "on success the worker writes $ART/preexisting.txt (one repo-relative path per line: untracked ∪ ignored after provisioning) and passes --preexisting \"$ART/preexisting.txt\" to compound-v-scope-check.py"
    - "on failure the worker emits a status: error job_result whose summary is 'provision failed (rc=N): <command>' and launches nothing"
    - "compound-v-scope-check.py --worktree honours --preexisting (documented in its docstring and --help)"
  acceptance:
  - 'scope-check selftest rows pass: a worktree repo with .gitignore node_modules/ and node_modules/x/a present is pass with an empty changed set when --preexisting lists the path, and a violation when it does not. All four worker scripts parse the two flags, run the command through /bin/bash -c under compound-v-run-with-timeout.py after git worktree add, snapshot, and pass --preexisting; shellcheck scripts/compound-v-*.sh clean; tests/test-worker-path-transport.sh gains a row that drives the codex worker with --provision-command against a stub codex on PATH and asserts the job_result is not blocked and lists no node_modules path; the whole file green.'
  body: 'Implement Task J-SCOPE of docs/superpowers/plans/2026-09-11-v3.6-wide-dispatch.md (spec F1, gate half). Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind). Tests first: the scope-check selftest row, then the worker row in tests/test-worker-path-transport.sh (read that file first to reuse its stub-worker fixture; if no codex stub exists, build the smallest one: a `codex` shell script on PATH that writes one in-lane file into --cd and exits 0). Keep the subtraction code in changed_files unchanged if it already applies in both modes; make the docstring and --help say worktree mode honours the post-provisioning snapshot. In the workers the logic is byte-identical across all four: parse flags; after worktree add, if the command is non-empty run python3 "$SCRIPT_DIR/compound-v-run-with-timeout.py" --timeout "$PROVISION_TIMEOUT" --cwd "$WT" -- /bin/bash -c "$PROVISION_COMMAND"; on rc != 0 emit the error job_result and exit without launching; on success snapshot with git -C "$WT" ls-files --others --exclude-standard -z and git -C "$WT" ls-files --others --ignored --exclude-standard -z -- . into $ART/preexisting.txt (NUL-split, one path per line) and add --preexisting to the scope-check call. Never add an exemption to the scope gate. Touch only your lane. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not.'
- id: validate-keys-advisories
  title: 'Task J-VALIDATE — provision_command keys; MEMORY_LANE_UNNAMESPACED; claude-advisor receipts (#19 F, F1, F7)'
  type: implement
  backend: claude
  tier: standard
  effort: medium
  isolation: worktree
  run: parallel
  depends_on: []
  test_scope: impacted
  write_allowed:
  - scripts/compound-v-validate-manifest.py
  - examples/manifest.example.yaml
  - agents/partition-reviewer.md
  - schemas/cross-model-receipt.schema.json
  - tests/test-agent-memory.sh
  read_allowed:
  - '**'
  interfaces:
    produces:
    - "manifest top-level keys provision_command (string, non-empty, no newline) and provision_timeout_s (int 1..1800, default 600 when absent)"
    - "advisory code MEMORY_LANE_UNNAMESPACED whose text names the namespaced form .claude/agent-memory/superpowers-v-<agent>/**; MEMORY_ONLY_LANE recognises both the bare and the namespaced form"
    - "schemas/cross-model-receipt.schema.json reviewer_backend accepts claude-advisor beside codex and gains a required boolean cross_model (true for codex, false for claude-advisor); the validator accepts it, refuses a receipt whose cross_model disagrees with its reviewer_backend, and prints WARN SECOND_OPINION_SAME_FAMILY on a false one"
    - "tests/test-agent-memory.sh asserts the namespaced lane and the new advisory (this job owns the test because it is a fixture OVER the validator and the shipped example: the three files must flip together or the wave blocks itself)"
  acceptance:
  - 'Validator selftest rows pass: provision_command 3 is FAIL, "" is FAIL, provision_timeout_s 0 is FAIL, a valid pair is PASS; a review job lane .claude/agent-memory/spec-reviewer/** (also ./-prefixed and file forms) yields advisory MEMORY_LANE_UNNAMESPACED, the namespaced lane does not, MEMORY_ONLY_LANE fires for both forms; a receipt with reviewer_backend claude-advisor and cross_model false is accepted with the WARN, the same backend with cross_model true is REFUSED, and an unknown backend is refused.'
  - 'examples/manifest.example.yaml validates, carries provision_command "npm ci" with a comment (runs once per fresh worktree before the before-image; idempotent; must not modify tracked files) and the review lane .claude/agent-memory/superpowers-v-spec-reviewer/**.'
  - 'agents/partition-reviewer.md lists the two new WARN rows (MEMORY_LANE_UNNAMESPACED, SECOND_OPINION_SAME_FAMILY), carries the memory-path sentence (it is the fifth memory agent and no other lane may touch it), and its Step 4 stance text no longer says that under the balanced stance standard routes to opus — routing-policy.md has routed claude.standard to sonnet since 3.0.5.'
  - 'tests/test-agent-memory.sh uses MEM_GLOB=.claude/agent-memory/superpowers-v-spec-reviewer/** and a MEM_FILE under it, adds a row asserting the bare form raises MEMORY_LANE_UNNAMESPACED, and EVERY pre-existing row in the file still passes — including the shipped-example row that asserts an empty warnings list.'
  body: 'Implement Task J-VALIDATE of docs/superpowers/plans/2026-09-11-v3.6-wide-dispatch.md (spec F1 validator part, F5, F7 receipt part). Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind). THIS LANE OWNS tests/test-agent-memory.sh, examples/manifest.example.yaml and the validator TOGETHER, on purpose: that test reads the example and runs the validator, so flipping any one of the three alone turns the test red and blocks the job. Flip all three in one commit. Two traps the archaeology audit found and you must handle: (1) reviewer_backend in schemas/cross-model-receipt.schema.json is a JSON-Schema const, not an enum — widening it changes the validator''s own error text, and there is an existing selftest assertion around scripts/compound-v-validate-manifest.py:5320 that pins that text; update the assertion rather than weakening the check. (2) tests/test-agent-memory.sh already asserts that the shipped example raises NO advisory (an empty warnings list) — your new advisory must not fire on the example you are also fixing. Tests first: write the selftest rows, run and see them fail, then implement. The five memory agents are spec-reviewer, partition-reviewer, code-archaeologist, domain-expert, doc-validator; the bare form is .claude/agent-memory/<bare>/…, the namespaced form is .claude/agent-memory/superpowers-v-<bare>/…. The memory-path sentence, verbatim, for agents/partition-reviewer.md: The harness names the memory directory after the agent''s full name; installed as a plugin that is .claude/agent-memory/superpowers-v-<agent>/ (field-observed on a downstream project, issue #19); a copy installed as a project agent would use the bare name. Type and range checks only for the provisioning keys — no heuristic that guesses whether a floor needs provisioning. Touch only your lane. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not.'
- id: laneguard-unresolved
  title: 'Task J-LANEGUARD — the unresolved record names the acting run and the bootstrap (#19 E)'
  type: implement
  backend: claude
  tier: deep
  effort: high
  isolation: worktree
  run: parallel
  depends_on: []
  test_scope: impacted
  write_allowed:
  - hooks/lane-guard.sh
  - tests/test-lane-guard.sh
  read_allowed:
  - '**'
  interfaces:
    produces:
    - "lane-guard-unresolved.jsonl record fields: candidate_runs [lane-map paths live at that moment]; why: isolated agent <cwd> did not resolve to a job in this run's lane map at the time of this <tool> call; the write was allowed and not lane-checked"
    - "log line ALLOW (register-lane bootstrap) for a Bash command containing compound-v-emit-workflow.py register-lane; no record is written for it"
  acceptance:
  - 'The bootstrap recogniser states its own limit where it is implemented: it keys on the TEXT of the command being run, which is a weaker subject than a process identity, so any call whose command merely contains the register-lane spelling is suppressed too. The domain audit MUST on this point binds — the comment says so plainly, and the suppression covers only the RECORD, never a lane decision: a write is still matched against the lane exactly as before.'
  - 'tests/test-lane-guard.sh rows pass: (a) a Bash payload whose command is <py> -B <emitter> register-lane --run-dir <run> --job-id j --isolation worktree --cwd <wt> under a live lane map exits 0, writes no lane-guard-unresolved.jsonl, and the log contains register-lane bootstrap; (b) a Write payload from an unregistered isolated cwd with two live runs produces exactly one record, in the newer run directory, with candidate_runs of length 2; (c) no record contains the text register-lane missing. shellcheck hooks/*.sh clean; the whole test file green; the hook still allows and denies exactly as before on every other row.'
  body: 'Implement Task J-LANEGUARD of docs/superpowers/plans/2026-09-11-v3.6-wide-dispatch.md (spec F4). Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind; the archaeology audit names the helper functions in tests/test-lane-guard.sh to copy). Tests first. In hooks/lane-guard.sh: recognise the bootstrap with the existing quote-aware tokenizer (match the register-lane subcommand of the emitter, never a substring of an unrelated path); for any other unresolved isolated-agent call pick ONE run — the one named by --run-dir in the command when present, else the newest live lane map (map_files already sorts by mtime) — and record there with candidate_runs listing every live map; replace the why text. The hook budget matters: no new subprocess on the common path. Touch only your lane. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not.'
