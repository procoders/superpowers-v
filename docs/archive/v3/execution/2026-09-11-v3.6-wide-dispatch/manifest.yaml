  - '**'
  interfaces:
    produces:
    - "commands/v-init.md: ### 1f. Skill hygiene (native /skill-doctor) after 1e; ### 4e. One optional project setting — advisorModel after 4d; one report line in Step 5"
    - "the exact skill-doctor command: python3 scripts/compound-v-run-with-timeout.py --timeout 180 -- claude -p '/skill-doctor' --output-format text < /dev/null"
    - ".claude/settings.json: {\"worktree\": {\"baseRef\": \"head\"}, \"advisorModel\": \"fable\"}"
  acceptance:
  - 'Step 1f: version gate claude --version >= 2.1.261 (the changelog version; skills.md says 2.1.252 — the step cites the stricter one); the command above; parse rows whose first column begins with superpowers-v:; print those rows (context, 7d tokens, uses, last used) and the sum of the context column over every loaded skill; state the three limits (per-machine session history, not a repo property; hook- and description-fired phases are not skill invocations, so 0× beside v-dispatch is not unused; unavailable over Remote Control and when feature-flag fetching is off); the rule report only — never disable, never write. Step 4e in the 4d style: offer, exact JSONC with "advisorModel": "fable" and the opus alternative, why (a stronger model judges at decision points inside every job; subagents inherit it), the pairing rule (an advisor must be at least as capable as the main model; a Fable main accepts only Fable 5.1), the cost (each call re-reads the whole transcript, uncached; Fable bills to usage credits on some plans after the /model fable consent), DISABLE_TELEMETRY turns it off, CLAUDE_CODE_DISABLE_ADVISOR_TOOL=1 disables it, merge-preserve every other key, never write without a yes. .claude/settings.json carries both keys. lint-frontmatter green; the emitter selftest still green.'
  body: 'Implement Task J-VINIT of docs/superpowers/plans/2026-09-11-v3.6-wide-dispatch.md (spec F6 and F7 /v:init parts). Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind; the library audit confirms the version floors and flag names against the official docs — use its figures, not memory). Match the surrounding style of commands/v-init.md: 1d-bis is the model for a presence probe, 4d for an offered setting. The nested claude -p is a read-only report with stdin closed and no permission flags — say that in the step. Touch only your lane. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not.'
- id: second-opinion-ladder
  title: 'Task J-SECOND — the second-opinion ladder: Codex, else advisor-assisted, else skip (F7)'
  type: implement
  backend: claude
  tier: standard
  effort: medium
  isolation: worktree
  run: parallel
  depends_on: []
  test_scope: impacted
  write_allowed:
  - commands/v-review-plan.md
  - skills/compound-v/cross-model-review.md
  - commands/v-dispatch.md
  - skills/compound-v/phase-3-parallel-opus-dispatch.md
  read_allowed:
  - '**'
  interfaces:
    consumes:
    - "receipt reviewer_backend claude-advisor and WARN SECOND_OPINION_SAME_FAMILY from validate-keys-advisories"
    produces:
    - "the ladder text (1 Codex CLI present → as today; 2 no Codex, advisor configured → advisor-assisted second look; 3 neither → skip with the notice) in cross-model-review.md, v-review-plan.md step 3, v-dispatch.md step 9, phase-3"
    - "the disclosure line, verbatim in every rendering: Second look by the same model family (Claude + advisor) — no decorrelation; not a cross-model review."
