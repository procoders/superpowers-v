acceptance_criteria:
  - 'AC-1 Every tests/*.sh and every scripts/*.py --selftest is green; lint-frontmatter, rules-lint, shellcheck hooks/*.sh scripts/compound-v-*.sh and the CI dead-link rule pass.'
  - 'AC-2 A manifest with provision_command "mkdir -p node_modules/x && touch node_modules/x/a" and a worktree job whose floor is "test -f node_modules/x/a" passes the floor and the gate reports no violation; the same job with provision_command absent is BLOCKED on node_modules/**.'
  - 'AC-3 A repository that gitignores docs/ finalizes a wave whose results land under docs/superpowers/execution/.'
  - 'AC-4 Record, given a pass receipt and --expect-verdict blocked, records success with verdict_disagreement and a summary that names both values and no cause.'
  - 'AC-5 hooks/lane-guard.sh writes no record for the register-lane bootstrap call and exactly one record, in the newest live run, for an unresolved write under two live runs.'
  - 'AC-6 No committed document that TELLS AN AUTHOR WHAT TO DECLARE names the bare .claude/agent-memory/spec-reviewer/** any more; the validator prints MEMORY_LANE_UNNAMESPACED for the bare form. Three known residuals are out of scope and named here so the reviewer does not chase them: agents/partition-reviewer.md keeps it as a deliberate counter-example, scripts/lint-frontmatter.py keeps it as a selftest fixture path, and docs/superpowers/architecture/architecture.md is a generated doc refreshed by /v:onboard --refresh after the release.'
  - 'AC-7 commands/v-init.md has Step 1f (skill-doctor) and Step 4e (advisor) in the offer-never-write style; .claude/settings.json in this repo carries advisorModel: fable.'
  - 'AC-8 usage.advisor_calls is measured from transcripts and shown by /v:status; this run reports it for at least one job, or reports null honestly.'
  - 'AC-9 The review job declared the namespaced memory lane, passed the gate, and REPORTED the version of the plugin that supplied its agent definition. Native memory is NOT claimed to have been exercised: the installed plugin cache on this machine lags HEAD, so the running spec-reviewer definition may predate memory: project. A hand-written file in that lane is not evidence of the native mechanism, and the review says so.'
