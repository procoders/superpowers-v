  body: 'Implement Task J-AGENTS of docs/superpowers/plans/2026-09-11-v3.6-wide-dispatch.md (spec F5 agents part, F7 nudges). Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind). Do NOT touch agents/partition-reviewer.md or tests/test-agent-memory.sh — validate-keys-advisories owns both and merged its changes in wave 1, so run bash tests/test-agent-memory.sh FIRST to see what the test now demands of the agent files, then make them satisfy it. The advisor paragraph is prose in the body of the agent definition, never frontmatter: no agent file may gain a model, memory or fable key. Touch only your lane. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not.'
- id: vinit-skilldoctor-advisor
  title: 'Task J-VINIT — /v:init Step 1f (native /skill-doctor) and Step 4e (advisorModel); this repo advises with Fable (F6, F7)'
