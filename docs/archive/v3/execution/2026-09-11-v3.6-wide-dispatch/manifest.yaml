  - when: tests/test-worker-path-transport.sh
    run: bash tests/test-worker-path-transport.sh
  - when: scripts/compound-v-validate-manifest.py
    run: bash -c '/usr/bin/python3 -B scripts/compound-v-validate-manifest.py --selftest >/dev/null && bash tests/test-agent-memory.sh >/dev/null && echo validator-ok'
  - when: hooks/lane-guard.sh
    run: bash -c 'shellcheck hooks/*.sh && bash tests/test-lane-guard.sh >/dev/null && echo lane-guard-ok'
  - when: tests/test-lane-guard.sh
    run: bash tests/test-lane-guard.sh
  - when: scripts/compound-v-usage-*.py
    run: bash -c '/usr/bin/python3 -B scripts/compound-v-usage-extract.py --selftest >/dev/null && /usr/bin/python3 -B scripts/compound-v-usage-aggregate.py --selftest >/dev/null && bash tests/test-usage-workflow.sh >/dev/null && echo usage-ok'
