acceptance_criteria:
- bash tests/test-dogfood-index.sh is green and shellcheck scripts/compound-v-dogfood-index.sh is clean; every other tests/*.sh and scripts/compound-v-*.py --selftest stays green under /usr/bin/python3 -B.
- docs/superpowers/dogfood/README.md exists; its row count equals `ls docs/superpowers/dogfood/*review*.md | wc -l`; running `bash scripts/compound-v-dogfood-index.sh` again on the merged tree leaves `git diff --exit-code docs/superpowers/dogfood/README.md` clean (idempotent).
- 'The footer reads `Reviews: N · APPROVED: A · ISSUES: I · other: O` with N == A+I+O; A is >= the number of files matching `grep -lE ''^(#+[[:space:]]*)?\\**VERDICT:?\\**[[:space:]]*\\**APPROVED'' docs/superpowers/dogfood/*-review*.md`; three files are spot-checked and quoted, including one whose verdict line starts with `## ` and one written as `VERDICT: **ISSUES**`; no `-impl.md` file appears as a row.'
test_contract:
  floor_command: bash tests/test-engine-c-contract.sh
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: scripts/compound-v-*.sh
    run: bash -c '[ -f {path} ] || exit 0; shellcheck {path}'
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
  - when: docs/superpowers/dogfood/README.md
    run: 'bash -c ''test -s docs/superpowers/dogfood/README.md && grep -q "^Reviews: " docs/superpowers/dogfood/README.md'''
