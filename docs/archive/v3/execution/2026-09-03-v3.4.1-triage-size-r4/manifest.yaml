acceptance_criteria:
- Every scripts/compound-v-*.py --selftest and every tests/*.sh is green under /usr/bin/python3 -B (CI's Python 3.9 floor); tests/v2.9-e2e passes under python3 -m unittest.
- Driven with synthetic UserPromptSubmit stdin against the merged tree, the hook returns TIER SCOPED for a small edit to scripts/compound-v-scorecard.py, TIER SCOPED with flavor scoped_plus for a small edit to scripts/compound-v-scope-check.py, TIER FULL for an edit naming a .env file, and TIER DIRECT for a README.md typo — each with a committed-shape record that validates against schemas/pre-eval-record.schema.json.
- compound-v-localize.py never searches a plain word (a request with no identifier returns failed without invoking the search backend), resolves a trailing-period path, and returns new_file for a named non-existent file whose parent exists.
- compound-v-fastpath-run.py at tier SCOPED resolves an unmapped changed path to at most five referencing tests plus the floor and never to full_command; at tier FULL an unmapped path still resolves to full_command.
- compound-v-validate-manifest.py --require-triage rejects a scoped_plus manifest without a deep Claude review job and accepts one with it; --require-cross-model-receipt rejects a missing or digest-mismatched receipt.
- No prose in commands/skills/agents still says the hook degrades to a reminder on needs_t3, or that /v:dispatch step 9 writes phase MERGED by hand.
test_contract:
  floor_command: /usr/bin/python3 -B scripts/compound-v-preeval.py --selftest
  full_command: bash -c 'for s in scripts/compound-v-preeval.py scripts/compound-v-localize.py scripts/compound-v-taxonomy.py scripts/compound-v-validate-taxonomy.py scripts/compound-v-fastpath-run.py scripts/compound-v-classify-request.py scripts/compound-v-validate-manifest.py; do /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; /usr/bin/python3 -B -m unittest discover -s tests/v2.9-e2e -p "test_*.py" >/dev/null 2>&1 || { echo "FAIL e2e"; exit 1; }; echo all-tests-ok'
  impacted_map:
  - when: hooks/**
    run: bash -c 'bash tests/test-native-points.sh && bash tests/test-epic-goal-stop.sh'
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; /usr/bin/python3 -B {path} --selftest'
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
  - when: tests/v2.9-e2e/*.py
    run: bash -c '[ -f {path} ] || exit 0; /usr/bin/python3 -B -m unittest discover -s "$(dirname {path})" -p "$(basename {path})"'
  - when: schemas/*.json
    run: bash -c 'for r in docs/superpowers/pre-eval/*.json; do /usr/bin/python3 -B -c "import json,sys; json.load(open(sys.argv[1]))" "$r" || exit 1; done; /usr/bin/python3 -B scripts/compound-v-preeval.py --selftest'
  - when: .claude/compound-v-impact-taxonomy*.yaml
    run: bash -c '/usr/bin/python3 -B scripts/compound-v-validate-taxonomy.py .claude/compound-v-impact-taxonomy.yaml && /usr/bin/python3 -B scripts/compound-v-taxonomy.py --selftest'
  - when: commands/v-triage.md
    run: bash tests/test-triage-landing.sh
