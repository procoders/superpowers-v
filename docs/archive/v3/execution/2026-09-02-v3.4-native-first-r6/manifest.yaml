acceptance_criteria:
- Every tests/*.sh and every script --selftest is green (CI's Python 3.9 floor).
- grep for epic-watch|headless-shim|goal_arm|--goal-status|--arm-goal|autonomy.watch|record-watcher across
  commands skills agents hooks scripts tests .github CONVENTIONS.md returns nothing.
- The UserPromptSubmit hook, driven with synthetic stdin, writes a pre-eval record bound to the stdin
  session and returns the tier in additionalContext; a question writes nothing.
- No prose in commands/skills/agents instructs an agent to append task-outcomes.jsonl or to run compound-v-update-memory.py.
- hooks/hooks.json registers no PostToolUseFailure hook; /v:dashboard has no serve mode.
- Attended DIRECT is documented as an ordinary commit; Phase L is documented as unattended-only and tests/test-triage-landing.sh
  still passes.
test_contract:
  floor_command: bash tests/test-epic-goal-stop.sh
  full_command: bash -c 'for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1;
    }; done; echo all-tests-ok'
  impacted_map:
  - when: hooks/**
    run: bash -c 'bash tests/test-epic-goal-stop.sh && bash tests/test-native-points.sh'
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; /usr/bin/python3 {path} --selftest'
  - when: commands/v-triage.md
    run: bash tests/test-triage-landing.sh
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
jobs:
- id: spec-review-3
  title: Review Gate — three passes against the spec and the feature-level acceptance criteria
  type: review
  backend: claude
  tier: deep
  effort: high
  isolation: direct
  run: serial
  write_allowed:
  - docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review-3.md
  read_allowed:
  - '**'
  acceptance:
  - The review-3 file exists with the five sections; it states, for each of the second pass's three items
    and the bytecode carve-out, closed or open with evidence; the verdict is APPROVED or ISSUES with a
    numbered list.
  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall).

    Follow it. This is the THIRD pass. Read the two earlier passes,

    docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review.md and

    docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review-2.md. The second pass closed the

    first''s eight items and raised three record defects (stale architecture KB citations to deleted

    scripts; two comments dating a fix to "3.4.1"; SKILL.md:39''s "append task-outcomes.jsonl"). The

    orchestrator closed those three directly (commit "fix(record): ...") and, separately, the scope gate

    gained a bytecode carve-out (scripts/compound-v-scope-check.py is_bytecode_noise) after the second

    pass''s own file was refused for a scripts/__pycache__/*.pyc. Verify each of the three closures and

    the carve-out''s selftest, then run the acceptance commands on the whole merged tree

    (runs r2, r4, r5 and the orchestrator''s fixes): every tests/*.sh, every script --selftest with

    /usr/bin/python3, the lint. Write docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review-3.md

    with ## Recall, ## SPEC, ## QUALITY, ## INTEGRATION, ## Verdict (APPROVED or ISSUES with a numbered

    list). Run python with `-B` so you write no bytecode. Report what you found, not what would be

    reassuring.

    '
