acceptance_criteria:
- 'Clear and simple, checked mechanically: `wc -l README.md` ≤ 130; no line over 200 characters outside code blocks and tables; no `##` section over 30 lines; the measurement essay (`Re-measured 2026-09-03`) appears in AGENTS.md and not in README.md.'
- 'True of the code: every command in README''s table exists under commands/; every backend named has an adapter under skills/backend-launcher/; the hook table matches hooks/hooks.json; the three tiers match scripts/compound-v-preeval.py; the two index numbers equal the footer of docs/superpowers/dogfood/README.md in HEAD; every relative link resolves (the dead-link gate replica exits 0).'
- docs/routing.svg is valid XML (python xml.etree parses it) and its text nodes name DIRECT, SCOPED, SCOPED+, FULL, Opus, Sonnet, Codex — and nothing about a 'fast path' or an 'advisor' that no longer exists.
- 'commands/v-init.md OFFERS to merge {"worktree": {"baseRef": "head"}} into the project''s .claude/settings.json (never .claude/compound-v.json; unrelated keys preserved; never written without a yes), says why (dependent jobs, finding 60) and discloses that the setting is a native project-wide Claude Code setting with values fresh|head; the stale ''armed epic goal rule'' sentence is gone; TROUBLESHOOTING.md has the entry with the symptom the emitter''s code actually produces; lint-frontmatter green.'
- 'Reader test (the reviewer performs it): reading README.md alone, write down the commands a newcomer types to install and run one feature; they are the ones the docs say.'
test_contract:
  floor_command: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: README.md
    run: bash -c 'test $(wc -l < README.md) -le 130 && /usr/bin/python3 -B scripts/lint-frontmatter.py .'
  - when: docs/routing.svg
    run: /usr/bin/python3 -B -c 'import xml.etree.ElementTree as E; E.parse("docs/routing.svg")'
  - when: commands/v-init.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: TROUBLESHOOTING.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: docs/superpowers/dogfood/README.md
    run: 'bash -c ''test -s docs/superpowers/dogfood/README.md && grep -q "^Reviews: " docs/superpowers/dogfood/README.md'''
  - when: docs/superpowers/dogfood/*.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
