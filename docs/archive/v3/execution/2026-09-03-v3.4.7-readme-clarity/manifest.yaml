  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it within a HARD BUDGET of 50 tool calls; FIRST action after Step 0: create docs/superpowers/dogfood/2026-09-03-v3.4.7-readme-clarity-review.md with the section skeleton and fill it as you verify. THE ONE RULE (Oleg, 2026-09-03): documentation must be clear and simple. Plain words, short sentences, one idea per paragraph, every claim true of the code in HEAD; anything measured, historical or defensive is linked (AGENTS.md, CHANGELOG.md, TROUBLESHOOTING.md), never repeated. Review the four jobs against docs/superpowers/specs/2026-09-03-v3.4.7-readme-clarity-design.md and this manifest''s five acceptance criteria — run each AC''s commands (the dead-link replica: for every markdown link in README.md, after dropping fenced blocks and inline code spans, the target must exist relative to the file''s directory). Perform the reader test yourself and quote what you wrote down. Judge clarity as
    a newcomer would: if a sentence needs the CHANGELOG to be understood, it is an ISSUE. Run python with -B; register your lane with a literal --cwd. Pre-flight 1A/1C MUSTs to verify explicitly: DIRECT has no model in prose or SVG; backend honesty wording; Codex ≥ 0.144.6; baseRef disclosed as native/project-wide with values fresh|head; no CLI pins in README; the essay exists once (AGENTS.md); the SVG title/desc rewritten; v-init.md''s stale ''armed epic goal rule'' sentence gone.'
