  body: 'SHARED TIER SENTENCES (use these words in prose and in the diagram, so they cannot disagree): DIRECT — a trivial, unambiguous edit: one worker edits, tests the floor, commits; no model routing happens (it is an ordinary commit by whichever model is already in the session). SCOPED — a bounded change: only the tests that reference what changed run, not the whole suite; the Opus reviewer still gates done. SCOPED+ — a small edit on a sensitive path: SCOPED plus a mandatory deep review and a cross-model (Codex) second opinion, with the human accepting. FULL — anything real: recon, three pre-flights (code archaeology, domain expert, library check), plan, manifest, parallel dispatch in isolated worktrees, a three-pass review. MODELS — Opus plans, judges and reviews; Sonnet executes junior slices and the two scanning agents; Codex is an opt-in worker (kernel-sandboxed) and the second opinion; Antigravity and Cursor are opt-in lower-trust workers. THE ONE RULE (Oleg, 2026-09-03): documentation
    must be clear and simple. Plain words, short sentences, one idea per paragraph, every claim true of the code in HEAD; anything measured, historical or defensive is linked (AGENTS.md, CHANGELOG.md, TROUBLESHOOTING.md), never repeated. Redraw docs/routing.svg per Task B of docs/superpowers/plans/2026-09-03-v3.4.7-readme-clarity.md. Read the current SVG once for size and style, then write a new one: a request enters the triage hook → three boxes DIRECT / SCOPED (+SCOPED+) / FULL → one line ''every write checked by the git-derived scope gate; an Opus review gates done''; legend for the models. Validate with python xml.etree before returning. Touch only docs/routing.svg. Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind). Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not. DIRECT gets NO model box (pre-flight
    1A: a DIRECT decision never reaches the routing table). Rewrite the SVG''s <title> and <desc> too — the XML text-node check reads them.'
- id: init-baseref
  title: Task C — /v:init offers the baseRef setting; TROUBLESHOOTING entry
  type: implement
  backend: claude
  tier: standard
  effort: medium
  isolation: worktree
  run: parallel
  depends_on: []
  write_allowed:
  - commands/v-init.md
  - TROUBLESHOOTING.md
  read_allowed:
  - '**'
  acceptance:
  - 'commands/v-init.md has a new step, in the command''s existing offer-never-write style (see its Step 4c for the shape), that OFFERS to merge {"worktree": {"baseRef": "head"}} into the project''s .claude/settings.json (create the file if absent, merge if present, never overwrite other keys, never without a yes) with one sentence why (a job that depends on another needs its worktree branched from HEAD, not the default ref, or its patch never integrates — finding 60); TROUBLESHOOTING.md has an entry ''A job with depends_on never merges / its worktree lacks the previous wave'' pointing at the setting and the offer; lint-frontmatter green. The offer names .claude/settings.json, preserves unrelated keys, discloses the project-wide scope and the two legal values; the stale ''armed epic goal rule'' sentence is gone; the TROUBLESHOOTING symptom is the one the emitter''s code produces.'
  body: 'BASEREF FACTS (pre-flight 1C): `worktree.baseRef` is a NATIVE Claude Code project setting in .claude/settings.json (values: `fresh` or `head`, nothing else); `head` makes every worktree in the repo — interactive --worktree sessions and every isolation:worktree subagent — branch from the current HEAD instead of the default ''fresh'' (which auto-refreshes from origin/HEAD daily). Compound V needs `head` so a job that depends on another gets a worktree that contains the previous wave (finding 60). Disclose that scope in one sentence wherever the setting is offered. Codex floor: ≥ 0.144.6 (not 0.143). Never copy CLI version pins (cursor-agent, agy) into README — they live in the adapter docs. Keep the Context7 install line exactly `/plugin install context7@claude-plugins-official`. THE ONE RULE (Oleg, 2026-09-03): documentation must be clear and simple. Plain words, short sentences, one idea per paragraph, every claim true of the code in HEAD; anything measured, historical or defensive
    is linked (AGENTS.md, CHANGELOG.md, TROUBLESHOOTING.md), never repeated. Implement Task C of docs/superpowers/plans/2026-09-03-v3.4.7-readme-clarity.md. Match the surrounding style of commands/v-init.md (its Step 4c is the model: offer, exact JSONC, why, never write silently). Touch only commands/v-init.md and TROUBLESHOOTING.md. Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind). Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not. The offer must say the file is .claude/settings.json (NOT .claude/compound-v.json), merge-preserve every unrelated key a real project''s settings.json carries (permissions, hooks, env), and disclose the project-wide scope. While in commands/v-init.md, fix the stale sentence at ~lines 605-607 about an ''armed epic goal rule'' in hooks/epic-goal-stop.sh — that rule was
    removed in 3.4.0; the hook has two gates (triage_gate, pipeline_bypass) per its own header. For TROUBLESHOOTING.md, verify the CURRENT no-baseRef failure mode in scripts/compound-v-emit-workflow.py (`_worktree_base_is_head` and the agent_isolation decision, finding 60/89) and write the symptom you can prove (e.g. the dependent job''s worktree lacks the previous wave and its patch is refused at integration), not a guess.'
