acceptance_criteria:
- '`emit` on a manifest whose implement lane has ≥ k prior failure records under the results root records `recall_check` {verdict, match_count, evidence[:3], recall_check_ms} in the emitted job entry AND (via register-lane''s new --recall-check-json) in state.json, and the implementer prompt carries the `## Prior failures on your lane` section with the evidence and the reading-budget instruction; with fewer records neither appears — proven by the emitter selftest with a temp results root.'
- 'With `memory.auto_tighten: true` the job''s tier is raised one rung via TIER_RAISE (light→standard, standard→deep; deep/frontier unchanged) inside job_entry BEFORE resolve_job_model, an explicit `model:` wins unchanged (asserted), and every `type: review` job''s acceptance gains the re-check clause; with the default false, the prompt section alone.'
- '`emit --no-recall`, a missing engine, an engine error, or a 30 s TimeoutExpired ⇒ emit proceeds and records `recall_check: {verdict: unavailable, note}`; never a refusal; the emit JSON summary lists recall_check (with recall_check_ms) per job.'
- skills/compound-v/memory.md and commands/v-init.md describe exactly these actions (the three phantom actions are gone; the zsh word-split note is present); CHANGELOG [Unreleased] has the entry with the 7-of-27 measurement and no other number; `compound-v-emit-workflow.py --selftest` and tests/test-engine-c-contract.sh green; lint green.
test_contract:
  floor_command: bash tests/test-engine-c-contract.sh
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: scripts/compound-v-emit-workflow.py
    run: /usr/bin/python3 -B scripts/compound-v-emit-workflow.py --selftest
  - when: skills/compound-v/memory.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: commands/v-init.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: CHANGELOG.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: docs/superpowers/dogfood/*.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
