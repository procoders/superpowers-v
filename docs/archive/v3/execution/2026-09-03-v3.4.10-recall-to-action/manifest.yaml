  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it within a HARD BUDGET of 40 tool calls; FIRST action after Step 0: create docs/superpowers/dogfood/2026-09-03-v3.4.10-recall-to-action-review.md with the section skeleton and fill it as you verify. This run is SCOPED+ (flavor scoped_plus): you are the mandatory deep review; a Codex cross-model receipt follows at dispatch step 8 — say so. Review both jobs against the spec and the four acceptance criteria; confirm the bridge never loosens (no lower tier, no other backend, no test-slice change) and that an explicit model: pin is never touched. Run python with -B; register your lane with a literal --cwd. Verify the pre-flight MUSTs: the raise happens before resolve_job_model; TIER_RAISE is a new dict (no TIERS indexing); the subprocess has timeout=30; register-lane carries --recall-check-json; no match/case anywhere in the diff; quote the measured recall_check_ms from this run''s own emit
