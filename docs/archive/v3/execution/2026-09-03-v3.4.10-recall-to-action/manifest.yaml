    a refusal; the emit JSON summary lists recall_check (with recall_check_ms) per job. Python 3.9: no match/case, no isinstance(x, A | B); stdlib only; the engine is a subprocess.'
  body: 'BUDGET: scripts/compound-v-emit-workflow.py is 6,000+ lines; six implementers ran out of turns reading it. At most 20 tool calls of reading in total: `grep -n` for each named symbol, then `sed -n` only the ranges you need; never Read the whole file; then edit; then run `--selftest` ONCE. Implement Task A of docs/superpowers/plans/2026-09-03-v3.4.10-recall-to-action.md (spec docs/superpowers/specs/2026-09-03-v3.4.10-recall-to-action-design.md). Pre-flight 1A corrected the plan (read the spec''s ''Decisions forced by pre-flight'' section first): the work goes in `job_entry` BEFORE `resolve_job_model(` (grep both); the verdict reaches state.json through `register-lane --recall-check-json` (grep `def cmd_register_lane` and the emitted register-lane command string); a NEW `TIER_RAISE` dict; `subprocess.run(timeout=30)`; every `type: review` job gets the clause; `def cmd_emit`''s JSON summary lists recall_check + recall_check_ms. Touch only scripts/compound-v-emit-workflow.py. Read the
