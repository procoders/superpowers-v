  archaeology: docs/superpowers/archaeology/2026-09-02-v3-4-native-first.md
  domain: docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md
  library: docs/superpowers/library-audit/2026-09-02-v3-4-native-first.md
