run_id: 2026-09-02-v3.4-native-first
feature: v3.4 native-first — keep the capability, drop the copy
routing_stance: balanced
max_parallel: 3
spec_path: docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md
plan_path: docs/superpowers/plans/2026-09-02-v3.4-native-first.md
audits:
  archaeology: docs/superpowers/archaeology/2026-09-02-v3-4-native-first.md
  # 1B skipped: internal tooling with no user-facing or regulated surface (skip rule in SKILL.md).
  domain: docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md
  library: docs/superpowers/library-audit/2026-09-02-v3-4-native-first.md
triage:
  tier: FULL
  pre_eval_id: 2026-09-02T170442Z-v3-4-native-first-replace-the-epic-goal-feature-a-of-hooks-e-5664
  taxonomy_digest: "sha256:1f2a12f634422ca72a66cfa195b731a0e19743b5e7fe622fb799821cf5e88e85"
  decided_at: "2026-09-02T17:04:42Z"
acceptance_criteria:
  - "Every tests/*.sh and every script --selftest is green (CI's Python 3.9 floor)."
  - "grep for epic-watch|headless-shim|goal_arm|--goal-status|--arm-goal|autonomy.watch|record-watcher across commands skills agents hooks scripts tests .github CONVENTIONS.md returns nothing."
  - "The UserPromptSubmit hook, driven with synthetic stdin, writes a pre-eval record bound to the stdin session and returns the tier in additionalContext; a question writes nothing."
  - "No prose in commands/skills/agents instructs an agent to append task-outcomes.jsonl or to run compound-v-update-memory.py."
  - "hooks/hooks.json registers no PostToolUseFailure hook; /v:dashboard has no serve mode."
  - "Attended DIRECT is documented as an ordinary commit; Phase L is documented as unattended-only and tests/test-triage-landing.sh still passes."
test_contract:
  floor_command: "bash tests/test-epic-goal-stop.sh"
  full_command: "bash -c 'for t in tests/*.sh; do bash \"$t\" >/dev/null 2>&1 || { echo \"FAIL $t\"; exit 1; }; done; echo all-tests-ok'"
  impacted_map:
    - when: "hooks/**"
      run: "bash -c 'bash tests/test-epic-goal-stop.sh && bash tests/test-native-points.sh'"
    - when: "scripts/compound-v-*.py"
      run: "bash -c '[ -f {path} ] || exit 0; /usr/bin/python3 {path} --selftest'"
    - when: "commands/v-triage.md"
      run: "bash tests/test-triage-landing.sh"
    - when: "tests/*.sh"
      run: "bash -c '[ -f {path} ] || exit 0; bash {path}'"
jobs:
  - id: epic-native
    title: "Epic goal and resurrection go native: /goal, /loop, /schedule replace Feature A and the schedulers"
    type: core_slice
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    write_allowed:
      - "hooks/epic-goal-stop.sh"
      - "tests/test-epic-goal-stop.sh"
      - "scripts/compound-v-epic-state.py"
      - "scripts/compound-v-epic-watch.py"
      - "scripts/compound-v-headless-shim.py"
      - "commands/v-epic.md"
      - "commands/v-init.md"
      - "commands/v-onboard.md"
      - "commands/v-status.md"
      - "skills/compound-v/epic-mode.md"
      - "docs/superpowers/loops.md"
      - ".github/workflows/validate.yml"
      - "CONVENTIONS.md"
    read_allowed:
      - "docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md"
      - "docs/superpowers/plans/2026-09-02-v3.4-native-first.md"
      - "docs/superpowers/architecture/native-mechanisms.md"
      - "README.md"
    acceptance:
      - "bash tests/test-epic-goal-stop.sh exits 0 and the file contains no goal-arm helper or goal check."
      - "python3 scripts/compound-v-epic-state.py --selftest is green and --help mentions no goal, watch, lease or resume-count flag."
      - "scripts/compound-v-epic-watch.py and scripts/compound-v-headless-shim.py no longer exist; validate.yml has no step for them."
      - "commands/v-epic.md §0c offers /loop or /schedule and §0d offers ProposeGoal or a /goal line, never arming silently; termination stops the loop."
      - "grep -rnE 'epic-watch|headless-shim|goal_arm|--goal-status|--arm-goal|autonomy\\.watch|record-watcher' over the files in write_allowed returns nothing."
    body: |
      Task A of docs/superpowers/plans/2026-09-02-v3.4-native-first.md — read the spec
      (docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md) WS1 first, then execute
      A1–A7 exactly as written. You own only the files in write_allowed.

      A1 hooks/epic-goal-stop.sh: delete `_goal_rule`, `_discover_state`, `_locate_cli` and the
      `_goal_rule` call in `hook_main`; the order becomes `_triage_rule` → `_enforcement_rule`.
      Rewrite the header: Feature A paragraphs, decision-table rows about the goal, INVARIANT 2
      become one line saying the goal rule was removed in 3.4.0 because the native /goal covers it.
      Keep both fail-open mechanisms, `_bounded_capture`, the markers and the store. shellcheck
      -S warning must stay clean.
      A2 tests/test-epic-goal-stop.sh: delete the `arm`/`slot_dir`/`statefile` helpers, the
      `--goal-status` fixture guard, and every goal check (armed/unmet, counter, re-arm, two
      projects, goal met, terminal-not-met, store loss, discovery, the two "GOAL rule outranks"
      precedence checks). Keep enforcement, triage-gate, bounded-check, shadow, registration and
      mechanism (a)/(b) sections. `bash tests/test-epic-goal-stop.sh` must exit 0.
      A3 scripts/compound-v-epic-state.py: remove the goal surface (--arm-goal, --disarm-goal,
      --goal-status, --replace-arm, --condition, --max-continues, the goal_arm record) and the
      watch surface (--watch, --max-resume-count, --reset-resume-count, --record-watcher-armed,
      --record-watcher-disarmed, --list-watchers, --liveness, --claim-resume, --renew-lease,
      --stale-after-min, --provider, --task-id, watcher_registry, resume_count, lease) with
      their selftests and docstring paragraphs. `--init --stance marathon`, the marathon loop,
      arbiter, breakers and --stats stay byte-identical. --selftest green.
      A4 git rm scripts/compound-v-epic-watch.py scripts/compound-v-headless-shim.py; delete
      their two selftest steps in .github/workflows/validate.yml and reword "quartet" to "pair";
      drop "epic-watch / headless-shim" from CONVENTIONS.md line 17.
      A5 commands/v-epic.md: replace §0c with "Resurrection" and §0d with "Goal" per spec WS1
      "Replace": offer, never silent; `/loop 30m /v:epic <epic-id>` (this session; the model may
      invoke the `loop` skill only after the user says yes) or a `/schedule` routine (cloud,
      machine-off); ProposeGoal with ask_user: true and the verbatim condition shape
      "epic `<epic-id>`: `python3 scripts/compound-v-epic-state.py --stats --state <path>`
      reports every feature `done` or the epic terminal", else print it as a `/goal` line;
      when the epic is terminal print "epic terminal — stop the loop" and stop it
      (ScheduleWakeup stop in dynamic mode; CronDelete on the /loop entry CronList shows).
      Remove every --claim-resume/--renew-lease/--record-watcher-*/--list-watchers/--liveness/
      --arm-goal instruction. Steps 1–7 and the marathon loop text otherwise unchanged.
      A6 skills/compound-v/epic-mode.md: delete the "Auto-resurrection watch" and "Armed goal
      condition" sections; add "Goal and resurrection are native (3.4.0)" with the honesty
      boundary from the spec. commands/v-init.md: delete Step 1d-ter; replace 3c's
      `epic.autonomy.watch` bullet with two sentences on /loop and /schedule; drop `watch` from
      the 4a template. commands/v-onboard.md: delete the headless-shim paragraph.
      commands/v-status.md: drop the --goal-status mentions. docs/superpowers/loops.md: rows
      03/04 name /loop and /schedule.
      A7 verify with the acceptance greps and commands, then stop. Do not touch README.md,
      CHANGELOG.md or SKILL.md — another job owns them.
  - id: triage-hook
    title: "The UserPromptSubmit hook runs the scorer; attended DIRECT is an ordinary commit; the failure ledger is removed"
    type: core_slice
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    write_allowed:
      - "scripts/compound-v-preeval.py"
      - "hooks/triage-prompt-nudge.sh"
      - "hooks/tool-failure-ledger.sh"
      - "hooks/hooks.json"
      - "tests/test-native-points.sh"
      - "commands/v-triage.md"
      - "commands/v-orchestrate.md"
      - "skills/compound-v/phase-preeval.md"
    read_allowed:
      - "docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md"
      - "docs/superpowers/plans/2026-09-02-v3.4-native-first.md"
      - "hooks/epic-goal-stop.sh"
      - "scripts/compound-v-taxonomy.py"
      - ".claude/compound-v-impact-taxonomy.example.yaml"
    acceptance:
      - "python3 scripts/compound-v-preeval.py triage --request-env X --repo . --session-id S --json prints {pre_eval_id, tier, decision, needs_t3, record_ref, predicates, declared_paths}; its docstring names both callers."
      - "commands/v-triage.md T2 is a one-line call to that subcommand."
      - "Driven with synthetic UserPromptSubmit stdin in a sandbox repo, hooks/triage-prompt-nudge.sh writes a record bound to the stdin session_id and prints additionalContext naming the tier; a question, a slash command, a second request, and pre_eval.enabled:false all stay silent with no record; a planted engine failure yields the reminder text and exit 0."
      - "hooks/tool-failure-ledger.sh is gone, hooks/hooks.json is valid JSON with no PostToolUseFailure block, and bash tests/test-native-points.sh exits 0."
      - "commands/v-triage.md documents attended DIRECT as an ordinary commit and Phase L as unattended-only; bash tests/test-triage-landing.sh exits 0."
    body: |
      Task B of docs/superpowers/plans/2026-09-02-v3.4-native-first.md — read the spec WS2,
      WS3c and WS4 first, then execute B1–B7 exactly as written. You own only the files in
      write_allowed.

      B1 scripts/compound-v-preeval.py: add a `triage` subcommand implementing today's
      commands/v-triage.md T2 block: --request-file F | --request-env VAR, --repo, --session-id,
      --t3-category, --json. It binds session_id/base_commit/declared_paths through
      build_record's kwarg exactly as T2 does, runs run_preeval, evaluates predicates 1–6, and
      prints the human report or, with --json, {pre_eval_id, tier, decision, needs_t3,
      t3_prompt?, record_ref, predicates:[{n,name,pass,why}], declared_paths}. It never runs git.
      Its docstring names both callers (commands/v-triage.md and hooks/triage-prompt-nudge.sh).
      Selftests: sandbox repo + the example taxonomy → JSON shape; needs_t3 shape; refused
      declared paths warned, not stored. --selftest stays green.
      B2 commands/v-triage.md T2: replace the inline python with the one-line call
      `python3 scripts/compound-v-preeval.py triage --request-env V_TRIAGE_REQUEST --repo .
      --session-id "$CLAUDE_CODE_SESSION_ID"` (+ --t3-category on re-entry). T3 unchanged.
      B3 hooks/triage-prompt-nudge.sh: keep the name, registration and every gate it has
      (event, not a slash command, not a short question, session id present, repo has
      .claude/compound-v.json or docs/superpowers, no covering record for this session, no
      active run). Then, instead of the reminder: write the prompt to a private temp file
      (umask 077), run `python3 <plugin>/scripts/compound-v-preeval.py triage --request-file
      <tmp> --repo <proj> --session-id <sid> --json` bounded to 8000 ms (copy the Stop hook's
      _bounded_capture pattern), unlink the file. On a record: additionalContext with tier,
      pre_eval_id, bands, override if any, predicates 1–6, and the sentence "record written, not
      committed: /v:orchestrate commits it at bind; for a DIRECT change include
      docs/superpowers/pre-eval/<id>.* in your commit." On needs_t3: the T3 prompt with "run
      /v:triage to finish — one light Task." On failure/timeout: today's reminder text
      unchanged. Never block, never commit, never exit non-zero. No marker file any more — the
      record is the marker. shellcheck -S warning clean. Resolve the plugin root the way the
      other hooks do (CLAUDE_PLUGIN_ROOT, else the hook's own directory's parent).
      B4 git rm hooks/tool-failure-ledger.sh; delete the PostToolUseFailure block from
      hooks/hooks.json (keep it valid JSON); delete the ledger section of
      tests/test-native-points.sh.
      B5 tests/test-native-points.sh triage section: change request → record + tier in
      context; question → silent, no record; slash → silent; second request → silent;
      pre_eval.enabled:false → silent, no record; planted engine failure (unreadable engine
      path) → reminder text, exit 0. bash tests/test-native-points.sh exits 0.
      B6 commands/v-triage.md: T4's DIRECT sentence → "Implement, run the floor, commit on the
      current branch — include docs/superpowers/pre-eval/<id>.* in the commit"; Phase L's
      heading → "Phase L — unattended landings only" (a /loop- or /schedule-driven session, or
      --permission-mode dontAsk); Phase L otherwise unchanged. commands/v-orchestrate.md 0a:
      DIRECT's next step is the commit, not --land. skills/compound-v/phase-preeval.md §1
      invariant 4: add one sentence — an attended DIRECT change is human-accepted by the human
      who reviews the diff and commits; the auto-route class (predicates 7–9) applies to
      unattended landings. bash tests/test-triage-landing.sh still exits 0.
      B7 live probe from your worktree root: drive the hook with synthetic stdin
      (hook_event_name UserPromptSubmit, session_id probe-<random>, cwd $PWD, prompt "rename
      the heading in docs/superpowers/loops.md") → a record appears under
      docs/superpowers/pre-eval/ bound to that session and stdout carries additionalContext
      with a tier; then delete the probe record files and the triage-outcomes line it appended
      (git checkout -- docs/superpowers/memory/triage-outcomes.jsonl). Report the observed tier
      and elapsed time in your summary. Do not touch README.md, CHANGELOG.md or SKILL.md.
  - id: observe-native
    title: "dashboard serve → /workflows; the scorecard reads results/*.json; update-memory removed"
    type: mechanical_refactor
    backend: claude
    tier: standard
    effort: medium
    isolation: worktree
    run: parallel
    write_allowed:
      - "scripts/compound-v-dashboard.py"
      - "scripts/compound-v-scorecard.py"
      - "scripts/compound-v-update-memory.py"
      - "scripts/compound-v-emit-workflow.py"
      - "commands/v-dashboard.md"
      - "commands/v-collect.md"
      - "agents/parallel-dispatcher.md"
      - "skills/compound-v/routing-policy.md"
      - "skills/compound-v/memory.md"
    read_allowed:
      - "docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md"
      - "docs/superpowers/plans/2026-09-02-v3.4-native-first.md"
      - "docs/superpowers/execution/2026-09-02-df27-full-pass/**"
      - "schemas/job_result.schema.json"
    acceptance:
      - "python3 scripts/compound-v-dashboard.py --selftest is green; the file has no http.server import and no serve subcommand; `resume` and `emit` still work."
      - "python3 scripts/compound-v-scorecard.py --update --from-runs docs/superpowers/execution regenerates docs/superpowers/memory/worker-performance.jsonl from manifest jobs × results/*.json, unioned with legacy task-outcomes.jsonl; --selftest covers a sandbox run dir."
      - "scripts/compound-v-update-memory.py no longer exists; grep -rn update-memory commands skills agents returns nothing."
      - "/usr/bin/python3 scripts/compound-v-emit-workflow.py --selftest is green and cmd_finalize_wave runs the scorecard update best-effort after a successful wave commit."
      - "commands/v-dashboard.md and commands/v-collect.md, agents/parallel-dispatcher.md, skills/compound-v/routing-policy.md, skills/compound-v/memory.md describe the scorecard as regenerated from run results and name /workflows + /tasks for a live view."
    body: |
      Task C of docs/superpowers/plans/2026-09-02-v3.4-native-first.md — read the spec WS3a
      and WS3b first, then execute C1–C4 exactly as written. You own only the files in
      write_allowed. Run the emit-workflow selftest with /usr/bin/python3 (it needs PyYAML).

      C1 scripts/compound-v-dashboard.py: delete _ReadOnlyHandler, _make_handler,
      _build_server, cmd_serve, _FakeServer, _invoke_handler, the `serve` argparse branch, the
      http.server/socketserver imports and every serve selftest; emit and resume unchanged
      (`python3 scripts/compound-v-dashboard.py resume --execution-root
      docs/superpowers/execution` still prints the resume line). commands/v-dashboard.md: the
      serve paragraph and the description line → "a live run is watched natively: /workflows
      (the progress tree Engine C populates through phase()/log()) and /tasks; emit is the
      static snapshot of past runs."
      C2 scripts/compound-v-scorecard.py: add --from-runs <execution-root> (default
      docs/superpowers/execution) to --update: for every <run>/manifest.yaml job that has a
      <run>/results/<id>.json, one record {run_id, type, backend, model, status, blocked,
      rework_rounds} — model from the manifest job's `model` when present else its resolved
      tier name; rework_rounds = number of results/attempts/<id>.*.json files. Legacy
      task-outcomes.jsonl lines are still read and unioned (dedup key run_id+type+backend+
      status). --query unchanged. Selftest with a sandbox run dir. git rm
      scripts/compound-v-update-memory.py.
      C3 scripts/compound-v-emit-workflow.py cmd_finalize_wave: after a successful wave
      commit, run `<python> <scripts>/compound-v-scorecard.py --update --from-runs
      <execution-root>` best-effort (never fatal; stderr note on failure). One selftest: a
      finalized wave leaves docs/superpowers/memory/worker-performance.jsonl refreshed.
      C4 prose: agents/parallel-dispatcher.md post-run memory step, commands/v-collect.md,
      skills/compound-v/routing-policy.md §Where the scorecard comes from,
      skills/compound-v/memory.md: the scorecard is regenerated from run results; no
      task-outcomes.jsonl append instruction remains; `grep -rn update-memory commands skills
      agents` returns nothing. Do not touch README.md, CHANGELOG.md or SKILL.md.
  - id: docs-release
    title: "README, SKILL.md, native-mechanisms, audit, CHANGELOG 3.4.0, version bump"
    type: docs
    backend: claude
    tier: light
    effort: low
    isolation: direct
    run: serial
    depends_on: [epic-native, triage-hook, observe-native]
    write_allowed:
      - "README.md"
      - "CHANGELOG.md"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "skills/compound-v/SKILL.md"
      - "docs/superpowers/architecture/native-mechanisms.md"
      - "docs/superpowers/architecture/2026-09-02-viability-audit.md"
    read_allowed:
      - "docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md"
      - "docs/superpowers/plans/2026-09-02-v3.4-native-first.md"
      - "commands/**"
      - "hooks/**"
      - "skills/**"
    acceptance:
      - "README has one Epic-autonomy bullet naming /goal, /loop, /schedule and no Marathon/Auto-Resurrection/Headless tier text; the /v:dashboard row says emit only; the triage paragraph says the UserPromptSubmit hook scores the first change request of a session."
      - "SKILL.md Stage −1 names the hook and /v:triage as the record's producers; the directory conventions say worker-performance.jsonl is derived from execution/*/results."
      - "native-mechanisms.md rows for the goal, resurrection and triage are updated, PostToolUseFailure is ❌ removed 3.4.0, and the summary counts are recomputed from the table; the audit's §7 rows 1, 2, 3, 4, 8, 10 are marked done."
      - "CHANGELOG has a [3.4.0] entry and both plugin manifests say 3.4.0; python3 scripts/lint-frontmatter.py . is clean (use /usr/bin/python3)."
    body: |
      Task D of docs/superpowers/plans/2026-09-02-v3.4-native-first.md — runs after A, B and C
      have merged, in the main checkout. Read the spec, then `git log --stat -3` and the
      three merged jobs' changes, so what you document is what landed, not what was planned.
      Execute D1–D5 exactly as written; you own only the files in write_allowed.
      D1 README: Marathon / Auto-Resurrection / Headless bullets → one "Epic autonomy" bullet
      naming /goal, /loop, /schedule and the honesty boundary (a /loop shares the session's
      fate; /schedule is the machine-off path with its own auth); /v:dashboard row → emit only
      + native /workflows; the triage paragraph: the UserPromptSubmit hook now scores the first
      change request of a session and writes the record (committed at bind).
      D2 SKILL.md: Stage −1 — the record's producers are the hook and /v:triage; directory
      conventions — worker-performance.jsonl is derived from execution/*/results,
      task-outcomes.jsonl is legacy input.
      D3 native-mechanisms.md: rows "Продолжение по цели", "Авто-воскрешение эпика", "Триаж
      на приходе запроса" (⚠ → ✅ with the reason), event table PostToolUseFailure ❌ (removed
      3.4.0); recompute the summary counts from the table; audit §7 rows 1, 2, 3, 4, 8, 10 →
      done in 3.4.0 (row 5 stays open by decision; 6, 7, 9 stay open).
      D4 CHANGELOG [3.4.0] — 2026-09-02 entry in the file's style (what changed, what was
      found live, what was removed and why); bump "version" to 3.4.0 in
      .claude-plugin/plugin.json and .claude-plugin/marketplace.json.
      D5 /usr/bin/python3 scripts/lint-frontmatter.py . must be clean; every intra-repo
      markdown link you add must resolve.
  - id: spec-review
    title: "Review Gate — three passes against the spec and the feature-level acceptance criteria"
    type: review
    backend: claude
    tier: deep
    effort: high
    isolation: direct
    run: serial
    depends_on: [docs-release]
    write_allowed:
      - "docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review.md"
    read_allowed:
      - "**"
    acceptance:
      - "The review file exists with SPEC, QUALITY and INTEGRATION sections, each naming the evidence it checked and a verdict APPROVED or ISSUES."
    body: |
      Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall).
      Follow it. Review the merged result of run 2026-09-02-v3.4-native-first against
      docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md and the manifest's
      acceptance_criteria. Run the commands the criteria name (tests, greps, selftests with
      /usr/bin/python3) rather than trusting summaries. Write
      docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review.md with sections
      ## Recall, ## SPEC, ## QUALITY, ## INTEGRATION, ## Verdict (APPROVED or ISSUES with a
      numbered list). Report what you found, not what would be reassuring.
