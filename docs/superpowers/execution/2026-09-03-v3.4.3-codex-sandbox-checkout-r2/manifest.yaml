  type: review
  backend: claude
  tier: deep
  effort: high
  isolation: direct
  run: serial
  depends_on:
  - sandbox-helper
  - docs-note
  write_allowed:
  - docs/superpowers/dogfood/2026-09-03-v3.4.3-codex-sandbox-checkout-review-1.md
  read_allowed:
