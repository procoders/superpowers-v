acceptance_criteria:
- bash tests/test-sandbox-checkout.sh is green and shellcheck scripts/compound-v-sandbox-checkout.sh is clean; every other tests/*.sh and scripts/compound-v-*.py --selftest stays green under /usr/bin/python3 -B.
- 'The multi-model contract, read from this run''s directory: results/sandbox-helper.json carries a UUID session_id, a worktree under $TMPDIR/compound-v/2026-09-03-v3.4.3-codex-sandbox-checkout/sandbox-helper (OUTSIDE the repository — never .cv-worktrees/), and files_changed equal to the job''s write_allowed; receipts/sandbox-helper.gate.json measured that worktree; logs/sandbox-helper.events.jsonl exists and its first line is a thread.started event; the wave commit touches exactly the lane; the review quotes `codex --version`.'
- The helper, run from the merged tree into a temp dir with --empty-pre-eval, yields a sandbox whose tracked files are byte-identical (diff -r against git ls-files content), with no docs/superpowers/execution/ and an empty pre-eval dir — and hooks/triage-prompt-nudge.sh (the UserPromptSubmit hook; the Stop hook needs .claude/compound-v.json, which a sandbox never has) driven inside that sandbox with synthetic stdin returns a TIER line.
- 'agents/spec-reviewer.md names the helper for probing on a checkout with a live run; CHANGELOG top heading is ## [3.4.3] - 2026-09-03 and says the helper was built by a Codex worker on Engine C; plugin.json and marketplace.json say 3.4.3; lint-frontmatter is green.'
test_contract:
  floor_command: bash tests/test-engine-c-contract.sh
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: scripts/compound-v-*.sh
    run: bash -c '[ -f {path} ] || exit 0; shellcheck {path}'
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; grep -q -- "--selftest" {path} || exit 0; /usr/bin/python3 -B {path} --selftest'
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
  - when: agents/*.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: .claude-plugin/*.json
    run: bash -c 'jq empty .claude-plugin/plugin.json && jq empty .claude-plugin/marketplace.json'
  - when: CHANGELOG.md
    run: /bin/echo changelog-only
jobs:
- id: sandbox-helper
  title: Task A (codex) — scripts/compound-v-sandbox-checkout.sh and tests/test-sandbox-checkout.sh
  type: large_isolated
  backend: codex
  tier: standard
  effort: medium
  isolation: worktree
  run: parallel
  timeout_sec: 900
  write_allowed:
  - scripts/compound-v-sandbox-checkout.sh
  - tests/test-sandbox-checkout.sh
  read_allowed:
  - '**'
  acceptance:
  - bash tests/test-sandbox-checkout.sh is green and asserts every case of plan Task A Step 1 (byte identity, kept modes, untracked absent, execution dir dropped/kept, pre-eval emptied, exit 3 on a non-empty dest, exit 2 outside a git repo); shellcheck scripts/compound-v-sandbox-checkout.sh is clean.
  - 'The script is bash 3.2 compatible, set -eu, uses git only (no python, no jq), never writes outside <dest>, and prints `sandbox: <dest>` and `files: <n> commit: <sha>` on success.'
  - A tracked symlink is copied as a symlink, never followed (the test creates one); --help states that gitignored files (lane-map.json, logs/*.jsonl) are never carried, keep-execution or not.
  body: 'Implement plan Task A (docs/superpowers/plans/2026-09-03-v3.4.3-codex-sandbox-checkout.md) against the spec (docs/superpowers/specs/2026-09-03-v3.4.3-codex-sandbox-checkout-design.md §Decisions 1–2). Write the failing test first, then the script. Bash 3.2 (macOS default): no associative arrays, no mapfile; `git ls-files -z` + `cp -p`; `set -eu`; shellcheck-clean. Touch only the two files of your lane. Pre-flight amendments 3–4 apply: symlinks are copied as symlinks (cp -pR on the single path, never follow), and --help says gitignored files are never carried.'
- id: docs-note
  title: Task B (claude) — the reviewer note, CHANGELOG 3.4.3, versions
  type: implement
  backend: claude
  tier: standard
  effort: medium
  isolation: worktree
  run: parallel
  write_allowed:
  - agents/spec-reviewer.md
  - CHANGELOG.md
  - .claude-plugin/plugin.json
  - .claude-plugin/marketplace.json
  read_allowed:
  - '**'
  acceptance:
  - 'agents/spec-reviewer.md §3.3 evidence notes carry one sentence naming scripts/compound-v-sandbox-checkout.sh <dest> --empty-pre-eval for probing hooks/triage-prompt-nudge.sh (the UserPromptSubmit hook — the Stop hook needs .claude/compound-v.json, which a sandbox never has) on a checkout with a live run; CHANGELOG top heading is ## [3.4.3] - 2026-09-03 with one Added section that says the helper was built by a Codex worker on Engine C (no fabricated metrics); plugin.json and marketplace.json say 3.4.3; /usr/bin/python3 -B scripts/lint-frontmatter.py . is green.'
  body: Implement plan Task B. You will not see Task A's script (it runs in parallel on the codex backend); describe the CLI exactly as the spec fixes it (§Decisions 1). Run python with -B; register your lane with a literal --cwd.
- id: spec-review
