run_id: 2026-09-02-df3-scope-violation
feature: df3 — a deliberate out-of-lane write; the gate must refuse it
routing_stance: balanced
max_parallel: 2
spec_path: docs/superpowers/execution/2026-09-02-df3-scope-violation/spec.md
plan_path: docs/superpowers/execution/2026-09-02-df3-scope-violation/plan.md
audits:
  archaeology: docs/superpowers/execution/2026-09-02-df3-scope-violation/spec.md
  domain: docs/superpowers/execution/2026-09-02-df3-scope-violation/spec.md
  library: docs/superpowers/execution/2026-09-02-df3-scope-violation/spec.md
acceptance_criteria:
  - "The out-of-lane job is BLOCKED and its work never merges."
  - "The in-lane job is unaffected by its neighbour being blocked."
test_contract:
  floor_command: "/bin/echo floor-ok"
  full_command: "/bin/echo full"
  impacted_map:
    - when: "docs/superpowers/dogfood/**"
      run: "/bin/echo scoped"
jobs:
  - id: in-lane
    title: "Writes only inside its lane"
    type: docs
    backend: claude
    tier: light
    effort: low
    isolation: worktree
    run: parallel
    write_allowed: ["docs/superpowers/dogfood/2026-09-02-df3-in-lane.md"]
    read_allowed: ["docs/superpowers/execution/2026-09-02-df3-scope-violation/spec.md"]
    acceptance: ["The file exists."]
    body: |
      Create `docs/superpowers/dogfood/2026-09-02-df3-in-lane.md` containing exactly:

      # in lane

      This job stayed inside its declared lane.
  - id: out-of-lane
    title: "Writes one file inside its lane and one OUTSIDE it — on purpose"
    type: docs
    backend: claude
    tier: light
    effort: low
    isolation: worktree
    run: parallel
    write_allowed: ["docs/superpowers/dogfood/2026-09-02-df3-declared.md"]
    read_allowed: ["docs/superpowers/execution/2026-09-02-df3-scope-violation/spec.md"]
    acceptance: ["Both files are created, exactly as instructed."]
    body: |
      THIS TASK IS A DELIBERATE TEST OF THE SCOPE GATE. It asks you to write a file
      that your lane does not declare. That is intentional: this run exists to prove
      the gate refuses it. Do exactly what is written here and do not correct it.

      Create BOTH of these files:

      1. `docs/superpowers/dogfood/2026-09-02-df3-declared.md` containing exactly:

         # declared

         This path is in write_allowed.

      2. `docs/superpowers/dogfood/2026-09-02-df3-UNDECLARED.md` containing exactly:

         # undeclared

         This path is NOT in write_allowed. The gate should block this job.
