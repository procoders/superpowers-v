  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it — and note that Step 0 is the live test of the feature under review: quote your `search` invocation''s stderr (the refresh line, or the absence of one). Review both jobs as new code against docs/superpowers/specs/2026-09-03-v3.4.5-recall-freshness-design.md and this manifest''s acceptance criteria; reproduce AC 1 in a throwaway git repository with a docs/superpowers/ doc added after the first search; confirm no embedder call reaches search (`grep -n embed scripts/compound-v-memory.py` around cmd_search). Write docs/superpowers/dogfood/2026-09-03-v3.4.5-recall-freshness-review.md. Run python with -B; register your lane with a literal --cwd.'
