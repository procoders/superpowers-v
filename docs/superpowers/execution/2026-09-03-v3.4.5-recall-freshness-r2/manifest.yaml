  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it and quote Step 0''s stderr (the refresh line, or its absence — nothing should be stale after this run''s own bookkeeping commit... unless it is: say which). This is the SECOND pass over v3.4.5: read review-1 (ISSUES 2 + 3 recorded items) and this run''s two jobs as new code; confirm items 1–5 closed with evidence (`grep` for the retired warning string across skills/ commands/ agents/; the finally; the single hash pass — count calls to file_sha per search with a quick instrumented run; the lock-held selftest present and green); re-run the four ACs as corrected in this manifest. Write docs/superpowers/dogfood/2026-09-03-v3.4.5-recall-freshness-review-2.md. Run python with -B; register your lane with a literal --cwd.'
