  body: 'Review pass 1 of this feature (docs/superpowers/dogfood/2026-09-03-v3.4.3-codex-sandbox-checkout-review-1.md) found two issues in your lane: (5) `--taxonomy-from` has no test; (6) the `files:` count is off by one when `--taxonomy-from` replaces a tracked path (count only paths the copy created). Add the test case first, then fix the count. Touch only scripts/compound-v-sandbox-checkout.sh and tests/test-sandbox-checkout.sh. Bash 3.2, set -eu, shellcheck-clean.'
