  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it. This is the SECOND pass. Read review-1 (ISSUES 7) and this run''s two fix jobs as new code; the orchestrator closed issues 1 and 3 in the emitter and the lane guard (commits after 87ed50b) — verify them from THIS run''s artefacts: results/sandbox-helper-fix.json session_id must equal the UUID in logs/sandbox-helper-fix.events.jsonl line 1. Do not run `codex`; the events log is the evidence. Write docs/superpowers/dogfood/2026-09-03-v3.4.3-codex-sandbox-checkout-review-2.md. Run python with -B; register your lane with a literal --cwd.'
