acceptance_criteria:
- bash tests/test-sandbox-checkout.sh is green and shellcheck scripts/compound-v-sandbox-checkout.sh is clean; every other tests/*.sh and scripts/compound-v-*.py --selftest stays green under /usr/bin/python3 -B.
- 'The multi-model contract, read from this run''s directory: results/sandbox-helper.json carries a UUID session_id, a worktree under $TMPDIR/compound-v/2026-09-03-v3.4.3-codex-sandbox-checkout/sandbox-helper (OUTSIDE the repository — never .cv-worktrees/), and files_changed equal to the job''s write_allowed; receipts/sandbox-helper.gate.json measured that worktree; logs/sandbox-helper.events.jsonl exists and its first line is a thread.started event; the wave commit touches exactly the lane; the review quotes `codex --version`.'
- The helper, run from the merged tree into a temp dir with --empty-pre-eval, yields a sandbox whose tracked files are byte-identical (diff -r against git ls-files content), with no docs/superpowers/execution/ and an empty pre-eval dir — and hooks/triage-prompt-nudge.sh (the UserPromptSubmit hook; the Stop hook needs .claude/compound-v.json, which a sandbox never has) driven inside that sandbox with synthetic stdin returns a TIER line.
- 'agents/spec-reviewer.md names the helper for probing on a checkout with a live run; CHANGELOG top heading is ## [3.4.3] - 2026-09-03 and says the helper was built by a Codex worker on Engine C; plugin.json and marketplace.json say 3.4.3; lint-frontmatter is green.'
test_contract:
  floor_command: bash tests/test-engine-c-contract.sh
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: scripts/compound-v-*.sh
    run: bash -c '[ -f {path} ] || exit 0; shellcheck {path}'
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; grep -q -- "--selftest" {path} || exit 0; /usr/bin/python3 -B {path} --selftest'
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
  - when: agents/*.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: .claude-plugin/*.json
    run: bash -c 'jq empty .claude-plugin/plugin.json && jq empty .claude-plugin/marketplace.json'
  - when: CHANGELOG.md
    run: /bin/echo changelog-only
jobs:
