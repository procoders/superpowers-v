  - 'scripts/compound-v-dogfood-index.sh derives `verdict` from the token the ANCHORED alternation matched (a line `VERDICT: ISSUES — the earlier pass was approved` yields ISSUES), and tests/test-dogfood-index.sh asserts it; the fixture also carries `## VERDICT: **ISSUES** (4)` (row ISSUES), a file whose only verdict-shaped text is mid-sentence (row unknown), and a lowercase `verdict: approved` (row APPROVED); bash tests/test-dogfood-index.sh green under /bin/bash; shellcheck clean; bash 3.2 idioms only.'
  body: 'Review pass 1 (docs/superpowers/dogfood/2026-09-03-epic-vi-review-index-review-1.md) found ISSUES: (1) the verdict value is taken by a bare substring scan of the whole line, APPROVED first — derive it from the token the anchored pattern matched; (3) no fixture for `## VERDICT: **ISSUES** (4)`; (4) the `^` anchor is unguarded — add a mid-sentence-only fixture expecting `unknown`; (5) case-insensitivity unguarded — add `verdict: approved`. Tests first, then the code. Touch only the script and its test. You are unattended: decide and return. Run python with -B; register your lane with a literal --cwd.'
