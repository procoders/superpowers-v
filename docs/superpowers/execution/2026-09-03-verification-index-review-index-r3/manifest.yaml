  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it. This is the SECOND pass over F1 of epic 2026-09-03-verification-index: read review-1 (ISSUES) and this run''s two jobs as new code; reproduce issue 1 against the merged script with a crafted line; run the r1 acceptance criteria as corrected here. Your own review files land in docs/superpowers/dogfood/ after the index was generated — say so; F2''s run regenerates the index. Write docs/superpowers/dogfood/2026-09-03-epic-vi-review-index-review-2.md. Run python with -B; register your lane with a literal --cwd.'
