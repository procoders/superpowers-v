feature: 'v3.4.8 workflow retry: transient API failures inside the workflow are retried with the failure policy''s backoff; a deep reviewer exhausted on a transient class is lifted to the frontier tier once; the class is recorded honestly; a manifest `retry` block with defaults on — r2: review pass 2 over review-1''s five closures'
