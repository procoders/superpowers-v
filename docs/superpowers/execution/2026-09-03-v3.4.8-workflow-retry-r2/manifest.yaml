acceptance_criteria:
- The emitted workflow wraps every stage's agent() call in withRetry, which retries on a NULL resolution or a thrown error with the deterministic table 2 s / 4 s (cap 60 s) up to retry.max_attempts (default 3) using setTimeout only (no Date.now, Math.random or new Date anywhere in the emitted script); the emitter selftest proves it with string checks and a Python mirror of the table.
- 'On exhaustion each stage falls into exactly today''s null path; Record writes `retries[]` and, for the exhausted job, `failure_class: other` with the reason `agent returned null N times (transient API failure suspected; the runtime''s failure text is not visible to the script)` — never a guessed class.'
- A review job exhausted transiently is re-spawned once with the next rung of CLAUDE_ESCALATION (opus → fable; an explicit manifest model off the ladder is never escalated) when retry.escalate_reviewer (default true); gate-receipt accepts --escalated-from and the receipt/result carry `escalated_from` as the requested escalation; implementers are never escalated; fast-path reviewers are stated out of scope.
- '`retry: {max_attempts, escalate_reviewer}` validates (int 1..3 not bool; bool; absent ⇒ 3/true; 1 ⇒ no retry); 0, 4, "3", a bool for the int, a non-bool for the flag and unknown keys are refused with a violation naming the key.'
- execution-manifest.md documents the block and corrects the reviewer invariant to deep-or-stronger; failure-policy.md and parallel-dispatcher.md Step 2c carry the parity paragraph; CHANGELOG [Unreleased] has the entry with no timing claim; every named selftest, tests/test-engine-c-contract.sh and lint-frontmatter green.
test_contract:
  floor_command: bash tests/test-engine-c-contract.sh
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: scripts/compound-v-emit-workflow.py
    run: /usr/bin/python3 -B scripts/compound-v-emit-workflow.py --selftest
  - when: scripts/compound-v-validate-manifest.py
    run: /usr/bin/python3 -B scripts/compound-v-validate-manifest.py --selftest
  - when: skills/compound-v/execution-manifest.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: skills/compound-v/failure-policy.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: CHANGELOG.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: docs/superpowers/dogfood/*.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: agents/parallel-dispatcher.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
