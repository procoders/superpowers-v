  - README.md's triage paragraph names the three tiers and SCOPED+ in one sentence; native-mechanisms.md has a row for the headless one-shot classify.
  body: "Implement plan Task F. Read the merged tree (Tasks A, B, D and E landed in commit 028b264 of the first run and Task C lands in this run's first wave — all are in HEAD by the time you run). Write the CHANGELOG from what actually landed — read the diffs of the five jobs' files against the run's baseline — never from the plan's promises. No fabricated metrics; the probe timings (5.5 s / 8.0 s) are measured and may be quoted as such. Run python with -B; register your lane with a literal --cwd.\n The CHANGELOG's [Unreleased] section already holds the stage-1 and stage-2 orchestrator fixes (phase advance, open-jobs hook window, run locks, PyYAML validator, partial-wave bookkeeping); keep them under the 3.4.1 heading and add the feature sections from the merged diffs: git diff 20ed725..HEAD -- <the five jobs' files>."
