  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it. Feature F1 one-matcher of epic 2026-09-03-glob-parity: spec docs/superpowers/execution/epics/2026-09-03-glob-parity/specs/one-matcher.md, plan docs/superpowers/plans/2026-09-03-epic-gp-one-matcher.md. Review the merged diff of job matcher-swap (git diff against the run''s base). Run the selftests yourself under /usr/bin/python3 (3.9). Write docs/superpowers/dogfood/2026-09-03-epic-gp-one-matcher-review-1.md and nothing else.'
