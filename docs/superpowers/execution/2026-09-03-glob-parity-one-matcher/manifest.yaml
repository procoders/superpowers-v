acceptance_criteria:
- python3 scripts/compound-v-memory.py --selftest passes and prints an ok line for every parity row (at least ten rows incl. app/[locale]/** and src/*.py vs src/a/b.py); python3 scripts/compound-v-scope-check.py --selftest still passes and the file is unchanged.
- grep -n fnmatch scripts/compound-v-memory.py prints nothing; _file_matches delegates to compound-v-scope-check.py matches() loaded by path, with the bare-path form meaning "this path or anything under it" via a /** fallback.
- python3 -B scripts/compound-v-memory.py recall-check --files 'app/[locale]/**' --json exits 0 with verdict in none|tighten|unavailable; when the sibling script cannot be loaded the verdict is unavailable with a note starting "scope-check matcher unavailable", never none.
test_contract:
  floor_command: bash -c 'python3 -B scripts/compound-v-memory.py --selftest >/dev/null && python3 -B scripts/compound-v-scope-check.py --selftest >/dev/null'
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done'
  impacted_map:
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; grep -q -- "--selftest" {path} || exit 0; /usr/bin/python3 -B {path} --selftest >/dev/null'
