  body: 'Implement Task A of docs/superpowers/plans/2026-09-03-epic-gp-one-matcher.md exactly (the code is in the plan): remove import fnmatch, add _SCOPE_CHECK_PATH/_SCOPE_MATCH/_scope_matches(), rewrite _file_matches to delegate to the scope gate matcher with the bare-path /** fallback, add the unavailable path at the top of recall_check, append the parity rows + the bare-dir and loader-failure checks to _selftest. Only scripts/compound-v-memory.py may change. Verify with python3 scripts/compound-v-memory.py --selftest and python3 scripts/compound-v-scope-check.py --selftest (both must pass) and grep -n fnmatch scripts/compound-v-memory.py (must print nothing). Commit in your worktree.'
