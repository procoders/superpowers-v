run_id: 2026-09-03-v3.4.8-workflow-retry
feature: 'v3.4.8 workflow retry: transient API failures inside the workflow are retried with the failure policy''s backoff; a deep reviewer exhausted on a transient class is lifted to the frontier tier once; the class is recorded honestly; a manifest `retry` block with defaults on'
routing_stance: balanced
max_parallel: 3
spec_path: docs/superpowers/specs/2026-09-03-v3.4.8-workflow-retry-design.md
plan_path: docs/superpowers/plans/2026-09-03-v3.4.8-workflow-retry.md
audits:
  archaeology: docs/superpowers/archaeology/2026-09-03-v3-4-8-workflow-retry.md
  domain: docs/superpowers/specs/2026-09-03-v3.4.8-workflow-retry-design.md
  library: docs/superpowers/library-audit/2026-09-03-v3-4-8-workflow-retry.md
triage:
  tier: FULL
  pre_eval_id: 2026-09-03T152726Z-implement-v3-4-8-per-docs-superpowers-specs-2026-09-03-v3-4-3862
