  acceptance:
  - 'Per the plan''s Task A as amended: withRetry triggers on null OR throw, deterministic backoff via setTimeout only, every stage''s agent( wrapped, isAgentTypeMissing fallback composed inside, retries[] carried into the result, exhaustion ⇒ today''s null path + failure_class other + the stated reason, reviewer lift via the emitted CLAUDE_ESCALATION map once with --escalated-from on gate-receipt and escalated_from on the result, CFG.retry from the manifest with defaults 3/true, selftests as listed, `--selftest` green, no forbidden pattern in the emitted script, Python 3.9.'
  body: 'BUDGET: scripts/compound-v-emit-workflow.py is 6,000+ lines and five implementers ran out of turns reading it. At most 20 tool calls of reading in total: `grep -n` for each named symbol first, then `sed -n` only the ranges you need; never Read the whole file; then edit; then run `--selftest` ONCE. Implement Task A of docs/superpowers/plans/2026-09-03-v3.4.8-workflow-retry.md (spec docs/superpowers/specs/2026-09-03-v3.4.8-workflow-retry-design.md). The spec''s ''Decisions forced by pre-flight'' section overrides the earlier text: the trigger is a NULL resolution; no Date/Math.random; setTimeout is confirmed to work (live probe). Symbols to grep: `async function gateStage`, the implement/record/finalize stage functions, `opts.model`, `CFG.` (how the JS config object is emitted), `def cmd_record`, `failure_class`. Touch only scripts/compound-v-emit-workflow.py. Read the pre-flight audits named in this manifest''s audits block first (their §7 MUSTs bind). Tests first. Python 3.9 syntax.
    Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return; if you approach your turn budget, commit what is complete and return a summary that says what is not. Also grep `FORBIDDEN_PATTERNS`, `CLAUDE_ESCALATION`, `escalate_claude_model`, `isAgentTypeMissing`, `def cmd_gate_receipt`.'
