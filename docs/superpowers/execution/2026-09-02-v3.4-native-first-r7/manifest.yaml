acceptance_criteria:
- Every tests/*.sh and every script --selftest is green (CI's Python 3.9 floor).
- grep for epic-watch|headless-shim|goal_arm|--goal-status|--arm-goal|autonomy.watch|record-watcher across
  commands skills agents hooks scripts tests .github CONVENTIONS.md returns nothing.
- The UserPromptSubmit hook, driven with synthetic stdin, writes a pre-eval record bound to the stdin
  session and returns the tier in additionalContext; a question writes nothing.
- No prose in commands/skills/agents instructs an agent to append task-outcomes.jsonl or to run compound-v-update-memory.py.
- hooks/hooks.json registers no PostToolUseFailure hook; /v:dashboard has no serve mode.
- Attended DIRECT is documented as an ordinary commit; Phase L is documented as unattended-only and tests/test-triage-landing.sh
  still passes.
test_contract:
  floor_command: bash tests/test-epic-goal-stop.sh
  full_command: bash -c 'for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1;
    }; done; echo all-tests-ok'
  impacted_map:
  - when: hooks/**
    run: bash -c 'bash tests/test-epic-goal-stop.sh && bash tests/test-native-points.sh'
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; /usr/bin/python3 {path} --selftest'
  - when: commands/v-triage.md
    run: bash tests/test-triage-landing.sh
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
jobs:
- id: spec-review-4
  title: Review Gate — three passes against the spec and the feature-level acceptance criteria
  type: review
  backend: claude
  tier: deep
  effort: high
  isolation: direct
  run: serial
  write_allowed:
  - docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review-4.md
  read_allowed:
  - '**'
  acceptance:
  - The review-4 file exists with the five sections; it states, for each of the third pass's three items
    and the two carve-outs, closed or open with evidence; the verdict is APPROVED or ISSUES with a numbered
    list.
  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall).

    Follow it. This is the FOURTH pass. Read the three earlier passes under docs/superpowers/dogfood/

    (…-review.md, …-review-2.md, …-review-3.md). The third pass raised three items, all in the scope

    gate''s bytecode carve-out: (1) the predicate dropped anything under __pycache__/; (2) three records

    contradicted the code; (3) no CHANGELOG entry. The orchestrator closed them in commit

    "fix(scope-gate): bytecode by extension only; the pipeline''s own outcome streams leave the changed

    set; records and CHANGELOG say so" — which ALSO added a second carve-out: the pipeline''s own outcome

    streams (docs/superpowers/memory/triage-outcomes.jsonl, worker-performance.jsonl) leave the changed

    set, because the third pass''s own file was refused as `contradicted` when Record''s merge_pending

    append landed between its gate and the authority. Review that commit as new code: reproduce the

    third pass''s payload.py/id_rsa probe against scripts/compound-v-scope-check.py and require BLOCK;

    check the bookkeeping carve-out cannot be abused to land anything (merge-back applies only approved

    paths); check .gitignore, the module docstring and CHANGELOG describe the code. Then run the

    acceptance commands on the whole merged tree: every tests/*.sh, every script --selftest with

    /usr/bin/python3 -B, the lint. Write docs/superpowers/dogfood/2026-09-02-v3.4-native-first-review-4.md

    with ## Recall, ## SPEC, ## QUALITY, ## INTEGRATION, ## Verdict (APPROVED or ISSUES with a numbered

    list). Run python with -B. Report what you found, not what would be reassuring.

    '
