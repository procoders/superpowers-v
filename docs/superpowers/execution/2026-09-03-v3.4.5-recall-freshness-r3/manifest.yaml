acceptance_criteria:
- 'On a repository whose index is behind, `python3 -B scripts/compound-v-memory.py search "<words from a newly added tracked doc>"` returns that doc with no other command having run and prints exactly one `V-memory: refreshed N stale doc(s) before recall (FTS5 lane)` line on stderr; `search --no-refresh` does not return it and prints the staleness warning; a search on a repo with no index builds one.'
- '`/usr/bin/python3 -B scripts/compound-v-memory.py --selftest` is green with the new case; every other `scripts/compound-v-*.py --selftest` and every `tests/*.sh` stay green.'
- 'A search never embeds: the inline refresh reports FTS5-only whether or not embeddings are bootstrapped, never applies the --quick cap, and vectors stay a /v:memory-refresh --with-embeddings job; `cmd_refresh --with-embeddings` after a search-triggered refresh still embeds the files that search re-chunked (the ordering hazard from pre-flight 1A). Routing and the conservative-only bridge are untouched.'
- 'skills/compound-v/memory.md, skills/compound-v/phase-0-recon.md, commands/v-remember.md and CHANGELOG.md describe the behaviour; no doc tells the user to refresh before a search and no doc quotes the retired warning string: `grep -rn ''memory-refresh'' commands/v-remember.md skills/compound-v/phase-0-recon.md` shows no such instruction, and memory.md''s staleness sentence states the real cost (git ls-files plus a content hash of every tracked doc).'
test_contract:
  floor_command: /usr/bin/python3 -B scripts/compound-v-memory.py --selftest
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: scripts/compound-v-memory.py
    run: /usr/bin/python3 -B scripts/compound-v-memory.py --selftest
  - when: skills/compound-v/memory.md
