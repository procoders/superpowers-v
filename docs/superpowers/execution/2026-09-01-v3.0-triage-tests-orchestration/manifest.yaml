    read_allowed:
      - "docs/superpowers/specs/**"
      - "agents/**"
      - "schemas/**"
    acceptance:
      - "floor unconditional; full_command at FULL and for unmapped paths"
      - "a job reporting no test command FAILS"

  - id: task-8-stop-rule
    title: "Triage rule inside the existing Stop hook, with the 1.5s budget respected"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 3600
