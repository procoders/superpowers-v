      - "docs/superpowers/preflight/**"
      - "hooks/**"
      - "tests/**"
    acceptance:
      - "a second RULE in the existing script, never a second registration"
      - "blocks at most once per session on its own marker, not on stop_hook_active"
      - "a bounded check that RECORDS incompletion rather than passing silently"
      - "test proves the raw script exits 2 when it fails to parse while || true still fails open"

  - id: task-9-engine-c
    title: "Engine C: emit a workflow whose gate is a stage that cannot throw"
    type: large_isolated
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract, task-6-transport, task-17-integration-authority]
    timeout_sec: 5400
    write_allowed:
      - "scripts/compound-v-emit-workflow.py"
      - "commands/v-dispatch.md"
      - "commands/v-resume.md"
      - "agents/parallel-dispatcher.md"
      - "skills/compound-v/workflows-accelerator.md"
      - "skills/compound-v/state-machine.md"
      - "skills/compound-v/phase-3-parallel-opus-dispatch.md"
      - "skills/compound-v/phase-0-recon.md"
      - "TROUBLESHOOTING.md"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "commands/**"
      - "agents/**"
      - "skills/**"
      - "scripts/**"
      - "schemas/**"
    acceptance:
      - "named Engine C throughout; Engine B is never used"
      - "Gate never throws, null is FAIL, Record is idempotent — AND each attempt and receipt is keyed to an immutable commit hash which is merged AT MOST ONCE, since a relaunch re-runs completed agents and idempotent Record alone still permits a double commit"
      - "emitted script has no Date.now, Math.random, bare new Date() or import()"
      - "scriptPath invocation forced; CLAUDE_CODE_WORKFLOWS probed with Engine A fallback"
      - "engine selection PROBES a clamped spawn rather than inferring support from the version floor. disallowedTools and bashCommandClamp were found in 2.1.238 and the product claims support from 2.1.219; a version that accepts Workflow but refuses the clamp would select Engine C and then fail to create the Gate agent"
      - "engine selection justified operationally, never by the refuted headless claim"
      - "non-claude jobs are emitted with isolation: direct at the AGENT level — the codex/gemini worker script creates and owns its own worktree, and nesting one inside a workflow worktree is untested. This repo already carries a downstream incident from getting worktree ownership wrong"
      - "a non-claude job's bashCommandClamp admits scripts/compound-v-run-<backend>-worker.sh, or carries no clamp — a clamp that binds nothing makes the runtime REFUSE the spawn"
      - "the emitted script USES the native budget global: it guards its fan-out on budget.remaining() and stops spawning rather than running past the ceiling. We are handing execution to a runtime that HAS a spend ceiling; not taking it would be leaving the only real cost control on the table"
      - "the emitted script USES phase() and log() so the native progress tree and narrator line are populated — progress visibility stops being something we render from our own state after the fact"
      - "THIS run is pinned to the pre-cutover dispatcher and resume contract through release: the new /v:resume must accept this run's pre-existing state.json, proven, because the session can die after this job merges and the remaining waves still have to finish on the old engine"
      - "whatever replaces the deleted batching prose PRESERVES the commit-before-dependent rule — a prerequisite merge-back only STAGES, so a dependent worktree created at HEAD would not see it. Deleting that rule mid-run breaks the very ordering this run depends on"
      - "the Gate stage PRODUCES the receipt: it returns baseline_commit, realised_commit, diff_digest, verdict, raw_stdout and exit_code, and Record persists them into the job result. With no producer every receipt is missing, task-17 re-derives for every job, and integration never completes for any run"
      - "compound-v-emit-workflow.py carries --selftest and is found by the CI sweep over scripts/*.py"
      - "/v:dispatch AND /v:resume invoke scripts/compound-v-integration-gate.py before ANY job commit is integrated. Without this the authority lands as another correct script with no caller — the exact defect this release exists to fix, reproduced in its own cure"
      - "/v:dispatch invokes the validator WITH --require-triage in EVERY mode — this is the mechanism that stops a future run repeating 3.0 own bootstrap exemption"
      - "task-6 job_spec test_contract slice propagated into the dispatcher canonical field list"

  - id: task-10-adrs
