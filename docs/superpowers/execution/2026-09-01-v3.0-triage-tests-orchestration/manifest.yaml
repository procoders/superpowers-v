  - id: task-15-lane-guard
    title: "Lane enforcement as a native PreToolUse deny, with the git verdict retained"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 5400
    write_allowed:
      - "hooks/lane-guard.sh"
      - "tests/test-lane-guard.sh"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "hooks/**"
