# Compound V 3.0 execution manifest.
#
# BOOTSTRAP NOTE, stated rather than skipped: this manifest carries no `triage`
# block, because the block is DEFINED by task-0 and its `taxonomy_digest` cannot
# exist until task-12 generates the taxonomy.
#
# The partition gate rejected the first version of this note, which claimed
# "every run after this one must carry it". Nothing in the design made that true:
# --require-triage defaults on only for --mode pre-dispatch, and that mode is
# selected only for fast_path manifests, so a normal 3.1 run would get exactly
# the same mode-less pass 3.0 gives itself -- permanently, not once. The closure
# is now a real mechanism and belongs to task-9: /v:dispatch invokes the
# validator WITH --require-triage on every dispatch, in every mode. The CI
# historical sweep stays mode-less and keeps its allowlist.

run_id: 2026-09-01-v3.0-triage-tests-orchestration
feature: "Compound V 3.0 — proportionate triage, scoped tests, native-Workflow dispatch"
spec_path: docs/superpowers/specs/2026-09-01-v3.0-triage-tests-orchestration-design.md
plan_path: docs/superpowers/plans/2026-09-01-v3.0-triage-tests-orchestration.md
audits:
  archaeology: docs/superpowers/preflight/2026-09-01-v3.0-1a-archaeology.md
  domain: docs/superpowers/preflight/2026-09-01-v3.0-1b-domain.md
  library: docs/superpowers/preflight/2026-09-01-v3.0-1c-docs.md

acceptance_criteria:
  - "A manifest without a well-formed triage block FAILS validation under --require-triage, proven on a planted violation"
  - "compound-v-preeval.py emits three tiers, and any fired override forces FULL even when the bands read low/low"
  - "The auto-route class re-validates single-path, sensitive-set, no-test-file AND the line budget against the realised diff, demoting to SCOPED on any failure"
  - "The sensitive set is read from the taxonomy, never hardcoded"
  - "floor_command runs at every tier; an unmapped path resolves to full_command; floor_only never resolves to an empty command"
  - "The floor runs impacted UNION previously-failing UNION newly-added"
  - "job_result carries tests{command,exit_code,scope,selected_count} and every worker receives the test contract as an argument, not as prompt prose"
  - "spec-reviewer FAILS a job that reports no test command at all"
  - "The emitted workflow script's Gate stage never throws, treats null as FAIL, and its Record stage is idempotent"
  - "The emitted script contains no Date.now, Math.random, bare new Date() or import()"
  - "Engine C is selected only in a top-level session where the live probe succeeds; Engine A everywhere else"
  - "CI executes the files under tests/, and the full-suite backstop always runs rather than being conditionally skipped"
  - "Every new guard is demonstrated to fail on a planted violation"
  - "No speed or cost claim ships with 3.0; README and CHANGELOG state the defaults are principle-derived"
  - "triage-outcomes.jsonl receives a predicted event per decision and an actual event per completed run"
  - "/v:dispatch invokes the validator WITH --require-triage in every mode, so no future run can repeat 3.0 bootstrap exemption"
  - "compound-v-emit-workflow.py carries --selftest and is discovered by the CI sweep"

routing_stance: balanced
max_parallel: 5

jobs:
  - id: task-0-contract
    title: "Manifest contract: triage block, test_contract, --require-triage, CI runs tests/"
    type: shared_foundation
    backend: claude
    tier: deep
    effort: high
    isolation: direct
    run: serial
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-validate-manifest.py"
      - "skills/compound-v/execution-manifest.md"
      - "examples/manifest.example.yaml"
      - ".github/workflows/validate.yml"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"
      - "docs/superpowers/preflight/**"
      - "docs/superpowers/execution/**"
      - "tests/**"
    acceptance:
      - "triage block validated under --require-triage; the flag ships DEFAULT OFF in every mode, because turning it on for --mode pre-dispatch before task-3 emits the block would red tests/v2.9-e2e inside task-0 itself"
      - "taxonomy_digest mismatch FAILS, tested against synthesized bytes since the real taxonomy does not exist until task-12"
      - "the historical 11 manifests are allowlisted by id, never back-filled"
      - "test_contract and per-job test_scope validated; floor_only never empty"
      - "CI executes tests/ and the new step is proven to fail on a planted violation"

  - id: task-1-preeval
    title: "Third tier in the scorer; any fired override forces FULL"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-preeval.py"
      - "scripts/compound-v-postdiff-reclassify.py"
      - "scripts/compound-v-classify-request.py"
      - "scripts/compound-v-localize.py"
      - "schemas/pre-eval-record.schema.json"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "scripts/**"
      - "schemas/**"
    acceptance:
      - "DECISION_SCOPED exists; matrix computed inside the engine, not post-hoc"
      - "selftest covers 9 cells, unknown, and override_fired beside low/low"
      - "pre-eval-record.schema.json's decision enum admits the third value — preeval's own selftest validates records against it and would otherwise fail"
      - "every binary consumer of the decision in this lane handles SCOPED explicitly, never by falling through to the fast-path branch"
      - "this lane's own Iron Invariant wording is amended (preeval.py:9-10, the record schema description)"

  - id: task-2-outcomes
    title: "SCOPED cohort + miscalibration circuit breaker"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-1-preeval]
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-triage-outcomes.py"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "scripts/**"
    acceptance:
      - "SCOPED is its own cohort; fast-path precision no longer corrupted"
      - "a predicted event is appended per decision and an actual event per completed run — the stream has never had a single data point"
      - "breaker never delays the first decision and disarms above the threshold"

  - id: task-3-fastpath
    title: "Materializer emits triage; the existing floor gets a producer and three sets"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract, task-1-preeval]
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-fastpath-materialize.py"
      - "scripts/compound-v-fastpath-run.py"
      - "tests/v2.9-e2e/**"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "scripts/**"
    acceptance:
      - "build_manifest emits triage; its selftest AND tests/v2.9-e2e updated in the same commit"
      - "ONLY NOW is --require-triage flipped to default-on for --mode pre-dispatch, since the block it demands now exists"
      - "run_test_floor returns below changed_paths and runs impacted+failing+new"
      - "no second floor is introduced"

  - id: task-4-triage-command
    title: "/v:triage, the caller the engine never had, plus the nine auto-route predicates"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-1-preeval, task-2-outcomes, task-3-fastpath, task-12-taxonomy]
    timeout_sec: 3600
    write_allowed:
      - "commands/v-triage.md"
      - "commands/v-orchestrate.md"
      - "docs/superpowers/pre-eval/**"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "commands/**"
      - "scripts/**"
    acceptance:
      - "record written AND committed under docs/superpowers/pre-eval/"
      - "predicate 7 floor-passed and predicate 8 full post-diff re-validation implemented"
      - "sensitive set read from the taxonomy, never hardcoded"

  - id: task-5-invariant
    title: "Amended Iron Invariant #4 across the prose surface"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 1800
    write_allowed:
      - "skills/compound-v/phase-preeval.md"
      - "skills/compound-v/SKILL.md"
      - "skills/compound-v/rationalization-table.md"
      - "skills/compound-v/routing-policy.md"
      - "scripts/compound-v-project-config.py"
      - "docs/superpowers/architecture/architecture.md"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "skills/**"
    acceptance:
      - "no unamended assertion survives IN THIS JOB'S OWN FILES — the repo-wide sweep is split across the owning jobs, since a grep criterion cannot reach into a concurrent lane"
      - "a rationalization row added for skipping the triage record"

  - id: task-6-transport
    title: "job_result tests block + a real test-contract argument to every worker"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 3600
    write_allowed:
      - "schemas/job_result.schema.json"
      - "skills/backend-launcher/SKILL.md"
      - "skills/backend-launcher/adapter-*.md"
      - "scripts/compound-v-run-*-worker.sh"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "schemas/**"
      - "skills/backend-launcher/**"
      - "scripts/**"
    acceptance:
      - "additionalProperties:false schema gains tests{command,exit_code,scope,selected_count}"
      - "test contract reaches workers as an argument, never as prompt prose"
      - "adapter-claude.md uses Engine C naming"
      - "the job_spec test_contract slice is defined here; task-9 propagates it into the dispatcher's canonical field list, which this job does not own"

  - id: task-7-review-gate
    title: "Tier-aware review gate; no test command reported is a FAIL"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-6-transport]
    timeout_sec: 1800
    write_allowed:
      - "agents/spec-reviewer.md"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "agents/**"
      - "schemas/**"
    acceptance:
      - "floor unconditional; full_command at FULL and for unmapped paths"
      - "a job reporting no test command FAILS"

  - id: task-8-stop-rule
    title: "Triage rule inside the existing Stop hook, with the 1.5s budget respected"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 3600
    write_allowed:
      - "hooks/epic-goal-stop.sh"
      - "tests/test-epic-goal-stop.sh"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "hooks/**"
      - "tests/**"
    acceptance:
      - "a second RULE in the existing script, never a second registration"
      - "blocks at most once per session on its own marker, not on stop_hook_active"
      - "a bounded check that RECORDS incompletion rather than passing silently"
      - "test proves the raw script exits 2 when it fails to parse while || true still fails open"

  - id: task-9-engine-c
    title: "Engine C: emit a workflow whose gate is a stage that cannot throw"
    type: large_isolated
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract, task-6-transport]
    timeout_sec: 5400
    write_allowed:
      - "scripts/compound-v-emit-workflow.py"
      - "commands/v-dispatch.md"
      - "commands/v-resume.md"
      - "agents/parallel-dispatcher.md"
      - "skills/compound-v/workflows-accelerator.md"
      - "skills/compound-v/state-machine.md"
      - "skills/compound-v/phase-3-parallel-opus-dispatch.md"
      - "skills/compound-v/phase-0-recon.md"
      - "TROUBLESHOOTING.md"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "commands/**"
      - "agents/**"
      - "skills/**"
      - "scripts/**"
    acceptance:
      - "named Engine C throughout; Engine B is never used"
      - "Gate never throws, null is FAIL, Record is idempotent"
      - "emitted script has no Date.now, Math.random, bare new Date() or import()"
      - "scriptPath invocation forced; CLAUDE_CODE_WORKFLOWS probed with Engine A fallback"
      - "engine selection justified operationally, never by the refuted headless claim"
      - "compound-v-emit-workflow.py carries --selftest and is found by the CI sweep over scripts/*.py"
      - "/v:dispatch invokes the validator WITH --require-triage in EVERY mode — this is the mechanism that stops a future run repeating 3.0 own bootstrap exemption"
      - "task-6 job_spec test_contract slice propagated into the dispatcher canonical field list"

  - id: task-10-adrs
    title: "ADR 0003 scoped tests, ADR 0004 Workflow as the dispatch engine"
    type: junior
    backend: claude
    tier: standard
    effort: medium
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 1800
    write_allowed:
      - "docs/superpowers/adr/0003-*.md"
      - "docs/superpowers/adr/0004-*.md"
    read_allowed:
      - "docs/superpowers/**"
      - "skills/**"
    acceptance:
      - "0003 names the v2.17 rejection, the v2.14.1 incident and the 0.2%-10.6% RTS miss rate as an optimistic floor"
      - "0004 names the workflows-accelerator guarantee it reverses"
      - "each records its own falsification condition"

  - id: task-11-v218-wiring
    title: "v2.18 job p5: arm/disarm wiring across the commands"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 3600
    write_allowed:
      - "commands/v-epic.md"
      - "commands/v-status.md"
      - "commands/v-init.md"
      - "skills/compound-v/epic-mode.md"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "commands/**"
      - "skills/**"
      - "scripts/**"
    acceptance:
      - "/v:epic arm/disarm plus the shim offer; /v:status armed-goal column; /v:init enforcement key"

  - id: task-12-taxonomy
    title: "Generate the impact taxonomy so the engine can stop saying unknown"
    type: standard
    backend: claude
    tier: deep
    effort: medium
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 1800
    write_allowed:
      - ".claude/compound-v-impact-taxonomy.yaml"
      - "scripts/compound-v-taxonomy.py"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "scripts/**"
      - "skills/**"
    acceptance:
      - "produced by /v:onboard draft-taxonomy, not hand-authored"
      - "sensitive set seeds skills/**/*.md, agents/*.md, commands/*.md, hooks/**, .github/**"
      - "a live --score-only probe returns a non-unknown band (score-only is documented as pure scoring, no writes)"
      - "--with-churn is NOT used: it would write a churn cache inside the worktree, and the scope gate unions ignored files, so that is an immediate BLOCK"

  - id: task-13-review
    title: "Three-pass Review Gate over the composite"
    type: review
    backend: claude
    tier: deep
    effort: high
    isolation: direct
    run: serial
    depends_on:
      - task-1-preeval
      - task-2-outcomes
      - task-3-fastpath
      - task-4-triage-command
      - task-5-invariant
      - task-6-transport
      - task-7-review-gate
      - task-8-stop-rule
      - task-9-engine-c
      - task-10-adrs
      - task-11-v218-wiring
      - task-12-taxonomy
    timeout_sec: 5400
    write_allowed: []
    read_allowed:
      - "**"
    acceptance:
      - "every feature-level acceptance criterion met"
      - "no write outside any job's partitioned set"
      - "no fabricated metric anywhere in the diff"

  - id: task-14-release
    title: "Release 3.0 — version lockstep, honest caveats, no speed or cost claim"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: direct
    run: serial
    depends_on: [task-13-review]
    timeout_sec: 3600
    write_allowed:
      - "CHANGELOG.md"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "README.md"
      - "AGENTS.md"
    read_allowed:
      - "**"
    acceptance:
      - "3.0.0 in lockstep across plugin.json, marketplace.json and the CHANGELOG heading — CI enforces this"
      - "README and AGENTS.md state the Claude Code >= 2.1.219 floor"
      - "both files state that Feature B defaults are principle-derived, the ~20,000-tests observation being unreproduced"
      - "NO speed and NO cost claim anywhere in the release text"
      - "the last unamended Iron Invariant assertion, in CHANGELOG history, is left as history and not rewritten"
