      - "tests/**"
    acceptance:
      - "the guard matches Bash as well as Write|Edit — the probe showed a Write|Edit-only matcher is bypassed by writing through the shell, and this environment nudges agents toward sed/heredocs"
      - "it MUST NOT deny an external worker invocation (scripts/compound-v-run-*-worker.sh): what that process writes happens outside any hook this session controls and is covered by the worker's own scope-gate call plus the D1 postcondition"
      - "denies a Write/Edit outside the acting job's write_allowed, resolving the job from agent_id with a cwd-to-worktree fallback"
      - "ALSO matches Bash and inspects the command — a Write|Edit-only matcher is bypassed by sed -i or a heredoc, and this environment actively nudges agents toward exactly that"
      - "reuses compound-v-scope-check.py's matcher rather than a second glob engine"
      - "a planted out-of-lane Write is denied, and a planted shell write via sed -i is denied — both proven, not asserted"
      - "no document claims the deny replaces the git-derived verdict; it is a floor under it"
      - "this job does NOT register the hook — hooks.json belongs to task-16, which depends on this job so the script exists before it is wired"

  - id: task-16-native-points
    title: "UserPromptSubmit fires triage; PostCompact supplies resume context"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract, task-15-lane-guard, task-4-triage-command]
    timeout_sec: 3600
    write_allowed:
      - "hooks/triage-prompt-nudge.sh"
      - "hooks/postcompact-resume.sh"
      - "hooks/hooks.json"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "hooks/**"
      - "scripts/**"
      - "commands/**"
    acceptance:
      - "the UserPromptSubmit hook is an IDEMPOTENT NUDGE, not an invocation: it fires only when no active run and no covering triage record exist, and never writes or commits a record itself. It fires on EVERY prompt, so without eligibility and dedup a mid-run 'status?' would mint another record, contaminate the outcome stream and change which record the Stop rule sees. The mechanical closures stay at dispatch validation and Stop"
      - "UserPromptSubmit nudges triage — the entry point the scorer has never had, since the skill description fires four transitions too late"
      - "PostCompact uses the summary it receives, improving on v2.19's SessionStart banner which fires on compact but cannot see what was summarized"
      - "both fail open and are silent when they cannot complete, never blocking a turn"
      - "hooks.json registers all three new hooks INCLUDING task-15's lane-guard, with the || true fail-open form — bash exits 2 on a parse error, which is exactly the blocking code"
      - "the EXISTING Stop registration is preserved verbatim: tests/test-epic-goal-stop.sh asserts it carries || true and that no Stop entry has a matcher, and that test is not in this lane"

  - id: task-17-integration-authority
    title: "The git-derived integration postcondition — the authority Engine C is NOT"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract, task-6-transport]
    timeout_sec: 5400
    write_allowed:
      - "scripts/compound-v-integration-gate.py"
      - "tests/test-integration-gate.sh"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "scripts/**"
      - "schemas/**"
      - "agents/**"
      - "commands/**"
    acceptance:
      - "implements spec D1: every original job must have exactly ONE gate receipt bound to its baseline commit, its realised commit and a diff digest"
      - "where a receipt is MISSING, null, or its digests disagree with the tree, this gate runs compound-v-scope-check.py ITSELF and that verdict wins — a workflow Gate agent returns a schema-valid verdict that proves JSON shape, never that the check ran"
      - "MISSING is not INVALID: a missing or null receipt makes this gate RE-DERIVE from git, and the derived verdict is authoritative — a clean re-derivation lets integration proceed, a violation BLOCKS it. Only a PRESENT receipt whose digests disagree with the tree is refused outright, because that is a forged claim rather than an absent one"
      - "INVOKES scripts/compound-v-scope-check.py as a subprocess and does NOT modify it — that matcher is consumed by task-15's lane guard, which merges first, and re-derivation needs no write access to it"
      - "carries --selftest and is picked up by the CI sweep over scripts/*.py"
      - "a planted forged receipt (valid shape, wrong digest) is REJECTED — proven, not asserted"
      - "a planted missing receipt causes RE-DERIVATION, and a BLOCK only where that re-derivation finds a real violation. Both branches proven, not asserted"

