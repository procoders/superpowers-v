# Compound V 3.0 execution manifest.
#
# BOOTSTRAP NOTE, stated rather than skipped: this manifest carries no `triage`
# block, because the block is DEFINED by task-0 and its `taxonomy_digest` cannot
# exist until task-12 generates the taxonomy.
#
# The partition gate rejected the first version of this note, which claimed
# "every run after this one must carry it". Nothing in the design made that true:
# --require-triage defaults on only for --mode pre-dispatch, and that mode is
# selected only for fast_path manifests, so a normal 3.1 run would get exactly
# the same mode-less pass 3.0 gives itself -- permanently, not once. The closure
# is now a real mechanism and belongs to task-9: /v:dispatch invokes the
# validator WITH --require-triage on every dispatch, in every mode. The CI
# historical sweep stays mode-less and keeps its allowlist.

run_id: 2026-09-01-v3.0-triage-tests-orchestration
feature: "Compound V 3.0 — proportionate triage, scoped tests, native-Workflow dispatch"
spec_path: docs/superpowers/specs/2026-09-01-v3.0-triage-tests-orchestration-design.md
plan_path: docs/superpowers/plans/2026-09-01-v3.0-triage-tests-orchestration.md
audits:
  archaeology: docs/superpowers/preflight/2026-09-01-v3.0-1a-archaeology.md
  domain: docs/superpowers/preflight/2026-09-01-v3.0-1b-domain.md
  library: docs/superpowers/preflight/2026-09-01-v3.0-1c-docs.md

acceptance_criteria:
  - "AC-01: `compound-v-preeval.py` emits three decision values; a selftest covers all 9 matrix cells, the unknown/fail-closed case, and that **any fired override forces FULL** even when the bands read `low`/`low`."
  - "AC-02: `compound-v-validate-manifest.py` FAILS on a missing or malformed `triage` block and on a `taxonomy_digest` mismatch. The flag ships default-off in every mode (turning it on before the materializer emits the block would red the e2e suite inside the task that adds it), **`/v:dispatch` passes it in every mode** so no future run repeats 3.0's bootstrap exemption. A planted violation is shown to fail."
  - "AC-03: `compound-v-fastpath-materialize.py` emits a `triage` block and its own selftest passes; the 11 historical files are allowlisted by id, never back-filled."
  - "AC-04: `/v:triage` exists, writes and commits a record, and `/v:orchestrate` obtains one when absent."
  - "AC-05: The auto-route class implements all nine predicates of A4, including floor-passed and full post-diff re-validation of predicates 2/5/6/line-budget. A test proves a change that outgrows the class is demoted and the demotion recorded. The `sensitive` set is read from the taxonomy, never hardcoded, and this repo's taxonomy lists `skills|agents|commands` markdown. A selftest proves the circuit breaker disarms auto-route once the rolling demotion rate exceeds the threshold, and that it never delays the first decision."
  - "AC-06: `phase-preeval.md`, `SKILL.md`, `rationalization-table.md` and `routing-policy.md` all carry the amended Iron Invariant #4; no LIVE file still asserts the unamended form — the four prose files plus `preeval.py` (BOTH the module docstring and line 58), `commands/v-init.md`, `compound-v-project-config.py`, `architecture.md`, the record schema and `pre-eval-config.md`. CHANGELOG history and archived run artifacts under `docs/superpowers/execution/**/jobs/` are history and are NOT rewritten."
  - "AC-07: `triage-outcomes.jsonl` receives `predicted` and `actual` events, and SCOPED is its own cohort in `compound-v-triage-outcomes.py`."
  - "AC-08: `.claude/compound-v-impact-taxonomy.yaml` exists here, produced by `/v:onboard draft-taxonomy`, and a live `--score-only` probe returns a non-`unknown` band."
  - "AC-09: `run_test_floor` gains a producer, returns below the `changed_paths` computation, and runs impacted ∪ previously-failing ∪ newly-added. No second floor is introduced."
  - "AC-10: The manifest accepts `test_contract` and per-job `test_scope`; every MATCHING map rule is unioned rather than first-match-wins, unattended DIRECT landing additionally requires `full_command`, an unmapped path resolves to `full_command`; `floor_only` never resolves to an empty command."
  - "AC-11: `job_result.schema.json` carries `duration_ms` (measured-only) and `failures[]` (machine-readable ids, without which previously-failing is uncomputable next run), and carries `tests: {command, exit_code, scope, selected_count}`, and every worker receives the test contract as a real argument, not as prompt prose."
  - "AC-12: `spec-reviewer.md` requires the floor unconditionally, requires `full_command` at FULL and for unmapped paths, and FAILS a job reporting no test command."
  - "AC-13: ADR 0003 (scoped tests) and ADR 0004 (Workflow as dispatch engine) exist, each naming the decision it supersedes and its own falsification condition."
  - "AC-14: The triage rule lives inside `epic-goal-stop.sh` as a second rule, is OFF by default, blocks at most once per session on its own marker, uses a bounded check that records incompletion rather than passing silently, and has a test proving the raw script exits 2 when it fails to parse while the `|| true` registration still fails open."
  - "AC-15: `compound-v-emit-workflow.py` emits implement → gate → record; the Gate stage never throws and treats `null` as FAIL; the Record stage is idempotent; the emitted script contains no `Date.now`, `Math.random`, bare `new Date()` or `import()`."
  - "AC-16: **Engine C is the default execution path.** `/v:dispatch` stops delegating the run to the `parallel-dispatcher` subagent, so `/v:epic` inherits it; the residual subagent path is selected only where the live probe fails or `CLAUDE_CODE_WORKFLOWS` refuses `scriptPath`. The batching, ordering and worktree prose in `agents/parallel-dispatcher.md` is deleted, not left beside Engine C. The naming 'Engine C' is used throughout; 'Engine B' never appears."
  - "AC-17: CI executes the files under `tests/`, and the full-suite backstop is a job that always runs rather than a conditionally-skipped one that reports Success."
  - "AC-18: v2.18's job p5 (command wiring for `/v:epic`, `/v:status`, `/v:init`, `epic-mode.md`) is complete, since v2.18 ships inside 3.0."
  - "AC-19: Every new script carries `--selftest` and is discovered by the existing CI sweep; every new guard is demonstrated to fail on a planted violation before it is trusted."
  - "AC-20: `hooks/lane-guard.sh` denies the DIRECTLY ATTRIBUTABLE operations — `Write`/`Edit`, and recognised shell write forms — outside the acting job's `write_allowed`, and does NOT claim to catch indirect writers (a build step or a generator script whose target never appears in the command string). A planted indirect writer must be caught by the integration postcondition instead, and that is tested, resolving the job from `agent_id` with a `cwd`-to-worktree fallback, and reusing `compound-v-scope-check.py`'s matcher rather than a second glob engine. A test proves a planted out-of-lane write is denied, and a second proves a shell write via `sed -i` is caught by the `Bash` matcher."
  - "AC-21: The git-derived verdict is retained and still authoritative; no document claims the deny replaces it."
  - "AC-22: `UserPromptSubmit` invokes triage, and `PostCompact` supplies resume context using the summary it receives."
  - "AC-24: the D1 integration authority is CALLED — /v:dispatch and /v:resume invoke the integration gate before integrating any job commit, proven end to end, not merely as a standalone script. It exists as code — every job carries exactly one gate receipt bound to baseline commit, realised commit and diff digest; a forged receipt is rejected and a missing one triggers re-derivation, both proven on planted cases."
  - "AC-25: the cross-vendor path survives the engine swap — a non-`claude` job's clamp admits its worker script, the lane guard does not deny that invocation, and its workflow agent runs `isolation: direct` so the worker owns its own worktree."
  - "AC-23: README, CHANGELOG and `AGENTS.md` state the Claude Code ≥ 2.1.219 floor and that Feature B's defaults are principle-derived, the '20,000 tests' observation being unreproduced."

routing_stance: balanced
max_parallel: 5

# Dispatch waves, written down rather than inferred at dispatch time (partition
# review W7). A prerequisite's merge-back only STAGES; the caller must COMMIT it
# before creating a dependent's worktree at HEAD, or the dependent will not see it.
# task-9 rewrites the orchestration prose that carries that rule, so it merges LAST
# in wave 2 -- see its acceptance line about preserving the commit-before-dependent rule.
#   wave 0 : task-0-contract                                    (serial)
#   wave 1 : task-1, task-5, task-6, task-8, task-10, task-11, task-12, task-15
#   wave 2 : task-2, task-3, task-7, task-17, then task-9 last
#   wave 3 : task-4                       (needs task-1, task-2, task-3, task-12)
#   wave 4 : task-16                      (needs task-4 — added in round 2, which is
#                                          what moved it out of wave 2)
#   wave 5 : task-13-review   (serial)
#   wave 6 : task-14-release  (serial)

jobs:
  - id: task-0-contract
    title: "Manifest contract: triage block, test_contract, --require-triage, CI runs tests/"
    type: shared_foundation
    backend: claude
    tier: deep
    effort: high
    isolation: direct
    run: serial
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-validate-manifest.py"
      - "skills/compound-v/execution-manifest.md"
      - "examples/manifest.example.yaml"
      - ".github/workflows/validate.yml"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"
      - "docs/superpowers/preflight/**"
      - "docs/superpowers/execution/**"
      - "tests/**"
    acceptance:
      - "triage block validated under --require-triage; the flag ships DEFAULT OFF in every mode, because turning it on for --mode pre-dispatch before task-3 emits the block would red tests/v2.9-e2e inside task-0 itself"
      - "taxonomy_digest mismatch FAILS, tested against synthesized bytes since the real taxonomy does not exist until task-12"
      - "the historical 11 manifests are allowlisted by id, never back-filled"
      - "test_contract and per-job test_scope validated; floor_only never empty"
      - "CI executes tests/ RECURSIVELY and for both extensions — a flat tests/*.sh glob misses tests/v2.9-e2e/*.py, which has never run in CI"
      - "the THREE targets the recursive glob newly activates (test-codex-review-schema-default.sh, test-session-banner-staleness.sh, and tests/v2.9-e2e/test_fastpath_and_escalation.py — the last is task-3 lane, concurrently modified) are verified green BEFORE wiring it — neither is in this lane and a red one would fail this job for reasons it cannot fix"
      - "the new step is proven to fail on a planted violation"

  - id: task-1-preeval
    title: "Third tier in the scorer; any fired override forces FULL"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-preeval.py"
      - "scripts/compound-v-postdiff-reclassify.py"
      - "scripts/compound-v-classify-request.py"
      - "scripts/compound-v-localize.py"
      - "schemas/pre-eval-record.schema.json"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/preflight/**"
      - "scripts/**"
      - "schemas/**"
    acceptance:
      - "DECISION_SCOPED exists; matrix computed inside the engine, not post-hoc"
      - "selftest covers 9 cells, unknown, and override_fired beside low/low"
      - "pre-eval-record.schema.json's decision enum admits the third value — preeval's own selftest validates records against it and would otherwise fail"
      - "every binary consumer of the decision in this lane handles SCOPED explicitly, never by falling through to the fast-path branch"
      - "this lane's own Iron Invariant wording is amended (preeval.py:9-10, the record schema description)"

  - id: task-2-outcomes
    title: "SCOPED cohort + miscalibration circuit breaker"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-1-preeval]
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-triage-outcomes.py"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "scripts/**"
    acceptance:
      - "SCOPED is its own cohort; fast-path precision no longer corrupted"
      - "the breaker numerator is NEGATIVE ACTUAL OUTCOMES — a demotion, a CI failure on the resulting commit, a revert of it, or a later escalation — never a demotion count alone. A mis-sized change that stays one allowed sub-20-line file is never demoted, so a demotion-only breaker stays armed through any number of bad commits"
      - "a predicted event is appended per decision and an actual event per completed run — the stream has never had a single data point"
      - "breaker never delays the first decision and disarms above the threshold"

  - id: task-3-fastpath
    title: "Materializer emits triage; the existing floor gets a producer and three sets"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract, task-1-preeval]
    timeout_sec: 3600
    write_allowed:
      - "scripts/compound-v-fastpath-materialize.py"
      - "scripts/compound-v-fastpath-run.py"
      - "tests/v2.9-e2e/**"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "scripts/**"
    acceptance:
      - "build_manifest emits triage; its selftest AND tests/v2.9-e2e updated in the same commit"
      - "does NOT flip any validator default — the mode-scoped default was removed as circular; the closure is /v:dispatch passing --require-triage explicitly, which task-9 owns"
      - "run_test_floor returns below changed_paths and runs impacted+failing+new"
      - "no second floor is introduced"

  - id: task-4-triage-command
    title: "/v:triage, the caller the engine never had, plus the nine auto-route predicates"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-1-preeval, task-2-outcomes, task-3-fastpath, task-12-taxonomy]
    timeout_sec: 3600
    write_allowed:
      - "commands/v-triage.md"
      - "commands/v-orchestrate.md"
      - "docs/superpowers/pre-eval/**"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "commands/**"
      - "scripts/**"
      - ".claude/**"
    acceptance:
      - "record written AND committed under docs/superpowers/pre-eval/"
      - "predicate 7 floor-passed and predicate 8 full post-diff re-validation implemented"
      - "the pre-commit recheck lands behind a REAL serialization boundary — an expected-HEAD `git update-ref` compare-and-swap — not a re-read. 'Atomic' was an assertion in the spec; two sessions can both pass the armed check, one disarm the breaker, and the other commit on already-passed authorization"
      - "tests prove ALL THREE fail: a substituted path, a mutated taxonomy, and a stale concurrent authorization"
      - "sensitive set read from the taxonomy, never hardcoded"

  - id: task-5-invariant
    title: "Amended Iron Invariant #4 across the prose surface"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 1800
    write_allowed:
      - "skills/compound-v/phase-preeval.md"
      - "skills/compound-v/SKILL.md"
      - "skills/compound-v/rationalization-table.md"
      - "skills/compound-v/routing-policy.md"
      - "scripts/compound-v-project-config.py"
      - "docs/superpowers/architecture/architecture.md"
      - "docs/superpowers/architecture/pre-eval-config.md"
    read_allowed:
      - "docs/superpowers/specs/**"
      - "skills/**"
    acceptance:
      - "no unamended assertion survives IN THIS JOB'S OWN FILES — the repo-wide sweep is split across the owning jobs, since a grep criterion cannot reach into a concurrent lane"
      - "a rationalization row added for skipping the triage record"
      - "pre-eval-config.md stops hardcoding the two-value decision enum and its FASTPATH-only conditional — after task-1 lands the third value that citation-verified doc is factually wrong"

  - id: task-6-transport
    title: "job_result tests block + a real test-contract argument to every worker"
    type: standard
    backend: claude
    tier: deep
    effort: high
    isolation: worktree
    run: parallel
    depends_on: [task-0-contract]
    timeout_sec: 3600
    write_allowed:
