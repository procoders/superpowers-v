    title: "Writes one dogfood file; declares NO test_scope"
    type: docs
    backend: claude
    tier: standard
    effort: medium
    isolation: worktree
    run: parallel
    write_allowed:
      - "docs/superpowers/dogfood/2026-09-02-df1-scoped.md"
    read_allowed:
      - "docs/superpowers/execution/2026-09-02-df1-test-scope/spec.md"
    acceptance:
      - "The file exists."
    body: |
      Create `docs/superpowers/dogfood/2026-09-02-df1-scoped.md` containing exactly:

      # Dogfood 1

      This job declared no `test_scope`.
