  domain: docs/superpowers/execution/2026-09-02-df1-test-scope/spec.md
  library: docs/superpowers/execution/2026-09-02-df1-test-scope/spec.md
acceptance_criteria:
  - "A job that declares no test_scope resolves to `impacted`, not `full`."
test_contract:
