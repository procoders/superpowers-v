acceptance_criteria:
- Every tests/*.sh and every script --selftest is green (CI's Python 3.9 floor).
- grep for epic-watch|headless-shim|goal_arm|--goal-status|--arm-goal|autonomy.watch|record-watcher across
  commands skills agents hooks scripts tests .github CONVENTIONS.md returns nothing.
- The UserPromptSubmit hook, driven with synthetic stdin, writes a pre-eval record bound to the stdin
  session and returns the tier in additionalContext; a question writes nothing.
- No prose in commands/skills/agents instructs an agent to append task-outcomes.jsonl or to run compound-v-update-memory.py.
- hooks/hooks.json registers no PostToolUseFailure hook; /v:dashboard has no serve mode.
- Attended DIRECT is documented as an ordinary commit; Phase L is documented as unattended-only and tests/test-triage-landing.sh
  still passes.
test_contract:
  floor_command: bash tests/test-epic-goal-stop.sh
  full_command: bash -c 'for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1;
    }; done; echo all-tests-ok'
  impacted_map:
  - when: hooks/**
    run: bash -c 'bash tests/test-epic-goal-stop.sh && bash tests/test-native-points.sh'
  - when: scripts/compound-v-*.py
    run: bash -c '[ -f {path} ] || exit 0; /usr/bin/python3 {path} --selftest'
  - when: commands/v-triage.md
    run: bash tests/test-triage-landing.sh
  - when: tests/*.sh
    run: bash -c '[ -f {path} ] || exit 0; bash {path}'
jobs:
- id: deletions-fixup
  title: The three deletions jobs A and B were denied by the clamp, plus one wrong sentence
  type: mechanical_refactor
  backend: claude
  tier: light
  effort: low
  isolation: worktree
  run: parallel
  write_allowed:
  - scripts/compound-v-epic-watch.py
  - scripts/compound-v-headless-shim.py
  - hooks/tool-failure-ledger.sh
  - tests/test-native-points.sh
  - skills/compound-v/phase-preeval.md
  - .github/workflows/validate.yml
  - CONVENTIONS.md
  read_allowed:
  - docs/superpowers/specs/2026-09-02-v3.4-native-first-design.md
  - docs/superpowers/plans/2026-09-02-v3.4-native-first.md
  - hooks/epic-goal-stop.sh
  - hooks/hooks.json
  acceptance:
  - scripts/compound-v-epic-watch.py, scripts/compound-v-headless-shim.py and hooks/tool-failure-ledger.sh
    no longer exist (git rm).
  - grep -rnE 'epic-watch|headless-shim|tool-failure-ledger' .github/workflows/validate.yml CONVENTIONS.md
    tests/test-native-points.sh returns nothing except a historical mention in a comment, and bash tests/test-native-points.sh
    exits 0.
  - 'skills/compound-v/phase-preeval.md no longer claims an uncommitted record is invisible to the Stop-time
    gate: the gate reads records off disk; only --require-triage and `git worktree remove` care about
    the commit.'
  body: "Run 2026-09-02-v3.4-native-first-r2 merged jobs A, B and C, but their implementers' shell\nwas\
    \ clamped to three command forms, so three `git rm` deletions never happened. You have a\ndeveloper's\
    \ shell now. Do exactly this, in your worktree:\n\n1. `git rm scripts/compound-v-epic-watch.py scripts/compound-v-headless-shim.py\
    \ hooks/tool-failure-ledger.sh`\n   (all three still exist; the manifests and hooks.json already stopped\
    \ referencing them).\n2. `grep -nE 'epic-watch|headless-shim|tool-failure-ledger' .github/workflows/validate.yml\
    \ CONVENTIONS.md tests/test-native-points.sh`\n   — remove any remaining live reference (a CI step,\
    \ a citation, a test section that runs the\n   ledger). A purely historical mention inside a comment\
    \ may stay. Re-verify CONVENTIONS.md's\n   cited validate.yml line range matches the file after the\
    \ deletions.\n3. skills/compound-v/phase-preeval.md: the \"Reliability\" bullet says an uncommitted\
    \ record is\n   \"invisible to --require-triage and to the Stop-time gate\". Correct it: hooks/epic-goal-stop.sh\n\
    \   reads the pre-eval records off disk (jq over docs/superpowers/pre-eval/*.json), so an\n   uncommitted\
    \ record DOES cover its declared paths for the Stop-time gate; what needs the\n   commit is --require-triage's\
    \ durability across `git worktree remove` and any other clone.\n4. Verify: `bash tests/test-native-points.sh`\
    \ exits 0; `python3 -m json.tool hooks/hooks.json`\n   parses (read-only check). Report exactly which\
    \ files you deleted and which lines you changed.\n"
