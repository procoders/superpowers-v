  - README.md's triage paragraph names the three tiers and SCOPED+ in one sentence; native-mechanisms.md has a row for the headless one-shot classify.
  body: 'Task F — release 3.4.1. In run r2 this job was done in the MAIN checkout by mistake of the emitter (finding 60), so its edits could not be merged; the diff was kept as docs/superpowers/execution/2026-09-03-v3.4.1-triage-size-r3/jobs/release.draft.patch (repo-relative, from the repository root). You are in your OWN worktree: `git apply --index docs/superpowers/execution/2026-09-03-v3.4.1-triage-size-r3/jobs/release.draft.patch` from the worktree root, then VERIFY it against the merged tree you are in — HEAD now also carries the orchestrator''s stage-2 fixes (fix(finalize) ×3, fix(validator), fix(preeval) flavor, fix(emit) finding 60) whose CHANGELOG lines live under [Unreleased]; keep every one of them under the 3.4.1 heading and add anything the draft missed by reading `git log --oneline 20ed725..HEAD` and the diffs of the five feature jobs. No fabricated metrics (the probe timings 5.5 s / 8.0 s are measured). Own the result: the acceptance below is yours, not the draft''s. Run
