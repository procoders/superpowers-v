acceptance_criteria:
- README.md contains exactly one `## Verification program` heading, placed before the last existing `##` section; it links to docs/superpowers/dogfood/README.md and that file exists.
- 'The section''s two numbers (review files, APPROVED) equal the `Reviews: N` and `APPROVED: A` values of the footer of docs/superpowers/dogfood/README.md on the merged tree, where that index was regenerated by `bash scripts/compound-v-dogfood-index.sh` in the same run (a second run of the script changes nothing).'
- /usr/bin/python3 -B scripts/lint-frontmatter.py . is green and bash tests/test-dogfood-index.sh stays green.
test_contract:
  floor_command: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  impacted_map:
  - when: README.md
    run: bash -c 'test $(grep -c "^## Verification program$" README.md) -eq 1 && test -f docs/superpowers/dogfood/README.md'
  - when: docs/superpowers/dogfood/README.md
    run: 'bash -c ''test -s docs/superpowers/dogfood/README.md && grep -q "^Reviews: " docs/superpowers/dogfood/README.md'''
jobs:
