  title: Task 0 — regenerate the dogfood index so F1's review files are counted
  type: implement
  backend: claude
  tier: light
  effort: low
  isolation: worktree
  run: serial
  depends_on: []
  write_allowed:
  - docs/superpowers/dogfood/README.md
  read_allowed:
  - '**'
  acceptance:
  - docs/superpowers/dogfood/README.md is exactly the output of `bash scripts/compound-v-dogfood-index.sh` run from the worktree root (a second run changes nothing).
  body: 'Task 0: run `bash scripts/compound-v-dogfood-index.sh` from your worktree root; the produced docs/superpowers/dogfood/README.md is the deliverable. Do not hand-edit it; run the script a second time and confirm `git diff --exit-code docs/superpowers/dogfood/README.md`. If the file did not change, say so and return success with no changes. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return.'
- id: readme-section
  title: Task A — the `## Verification program` section of README.md
  type: implement
  backend: claude
  tier: light
  effort: low
  isolation: worktree
  run: serial
  depends_on:
  - index-refresh
  write_allowed:
  - README.md
  read_allowed:
  - '**'
  acceptance:
  - 'README.md has exactly one `## Verification program` section, inserted before the LAST existing `##` heading: three sentences — what the program is (stages 1–8, each a dogfood cycle against native Claude Code mechanisms), a link to docs/superpowers/dogfood/README.md, and `N review files, A APPROVED` with N and A copied from that file''s footer line `Reviews: N · APPROVED: A · …` as it is in HEAD (index-refresh ran first); `/usr/bin/python3 -B scripts/lint-frontmatter.py .` green.'
  body: 'Task A (docs only): read the footer of docs/superpowers/dogfood/README.md (`Reviews: N · APPROVED: A · ISSUES: I · other: O`), then insert a `## Verification program` section before the last existing `##` section of README.md: (1) what the program is — stages 1–8, each a dogfood cycle that runs this plugin against a native Claude Code mechanism and fixes what breaks; (2) a link to docs/superpowers/dogfood/README.md; (3) the sentence `N review files, A APPROVED` with the footer''s numbers verbatim. No other README change. Quote the footer line in your summary. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return.'
- id: spec-review
  title: Review Gate — three passes against the spec and the feature acceptance criteria
  type: review
  backend: claude
  tier: deep
  effort: high
  isolation: direct
  run: serial
  depends_on:
  - readme-section
  write_allowed:
  - docs/superpowers/dogfood/2026-09-03-epic-vi-readme-section-review.md
  read_allowed:
  - '**'
  acceptance:
  - 'The review file exists with ## Recall, ## SPEC, ## QUALITY, ## INTEGRATION, ## Verdict; each feature-level acceptance criterion is run on the merged tree with the command and output; the two numbers in README.md are compared against the footer of docs/superpowers/dogfood/README.md in HEAD (the review notes that its own file lands after the index and is not counted); the verdict is APPROVED or ISSUES with a numbered list.'
  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). Follow it. This is F2 of epic 2026-09-03-verification-index (depends on F1 review-index, already merged): review the two jobs of this run as new code against the spec and this manifest''s acceptance criteria; verify the numbers by reading both files; run `bash scripts/compound-v-dogfood-index.sh` and confirm `git diff --exit-code docs/superpowers/dogfood/README.md` (your worktree is a fresh checkout — say if the footer changed and whether the README numbers still match). Write docs/superpowers/dogfood/2026-09-03-epic-vi-readme-section-review.md. Run python with -B; register your lane with a literal --cwd.'
