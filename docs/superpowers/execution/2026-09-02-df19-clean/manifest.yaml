run_id: 2026-09-02-df19-clean
feature: df19 — the whole pipeline, quiet tree, nothing touched
routing_stance: balanced
max_parallel: 2
spec_path: docs/superpowers/execution/2026-09-02-df19-clean/spec.md
plan_path: docs/superpowers/execution/2026-09-02-df19-clean/plan.md
audits:
  archaeology: docs/superpowers/execution/2026-09-02-df19-clean/spec.md
  domain: docs/superpowers/execution/2026-09-02-df19-clean/spec.md
  library: docs/superpowers/execution/2026-09-02-df19-clean/spec.md
acceptance_criteria:
  - "The review job carries agentType superpowers-v:spec-reviewer."
test_contract:
