    acceptance: ["The file exists."]
    body: |
      Create `docs/superpowers/dogfood/2026-09-02-df19-clean-impl.md` containing exactly:

      # impl

      Written for the reviewer to read.
  - id: spec-review
    title: "Review job — must spawn by role"
    type: review
    backend: claude
    tier: deep
    effort: high
    isolation: direct
    run: serial
    depends_on: [impl-slice]
    write_allowed: ["docs/superpowers/dogfood/2026-09-02-df19-clean-review.md"]
    read_allowed: ["docs/superpowers/dogfood/2026-09-02-df19-clean-impl.md"]
    acceptance: ["The review file exists and names the file it reviewed."]
    body: |
      Read `docs/superpowers/dogfood/2026-09-02-df19-clean-impl.md`, then create
      `docs/superpowers/dogfood/2026-09-02-df19-clean-review.md` containing exactly:

      # review

